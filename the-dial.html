const sum = xs => xs.reduce((a,b)=>a+b,0);
function integer(value,min,max,label='value') { if(!Number.isInteger(value)||value<min||value>max)throw new RangeError(`${label} must be an integer from ${min} to ${max}`);return value; }
const MENU = [4,6,8,10,12];

// Gosnell & Tavoni (2017): demands are percentages of ORIGINAL wealth.
function bargainConfig(treatment='ASYM',role='poor') {
  if(!['SYM','ASYM','PSD','RSD','ASD'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['poor','rich'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment==='SYM';
  return {treatment,role,human:symmetric?0:role==='rich'?0:2,wealth:symmetric?Array(6).fill(100/6):[30,30,10,10,10,10]};
}
function bargainTarget(round) {integer(round,1,8,'round');return 60-10*Math.floor((round-1)/2);}
function bargainGroups(treatment) {return [...(['RSD','ASD'].includes(treatment)?[[0,1]]:[]),...(['PSD','ASD'].includes(treatment)?[[2,3,4,5]]:[])];}
function bargainCaps(config,round,humanVote=100) {
  integer(humanVote,0,100,'side-deal vote');
  const target=bargainTarget(round),caps=Array(6).fill(100),deals=[];
  for(const members of bargainGroups(config.treatment)) {
    const votes=members.map(i=>i===config.human?humanVote:target),cap=sum(votes)/members.length;
    members.forEach(i=>caps[i]=cap);deals.push({members,votes,cap});
  }
  return {caps,deals};
}
function bargainResolve(config,round,caps,humanDemand) {
  const target=bargainTarget(round),h=config.human;
  if(caps.length!==6||caps.some(c=>!Number.isFinite(c)||c<0||c>100))throw new RangeError('Invalid caps');
  if(!Number.isFinite(humanDemand)||humanDemand<0||humanDemand>caps[h]+1e-9||Math.abs(humanDemand*4-Math.round(humanDemand*4))>1e-7)throw new RangeError('Demand must be a legal quarter percentage point');
  const percentages=caps.map((cap,i)=>i===h?humanDemand:Math.min(target,cap));
  const demands=percentages.map((p,i)=>p*config.wealth[i]/100),total=sum(demands),agreement=total<=target+1e-9;
  const finished=agreement||round===8,payoffs=agreement?demands:finished?config.wealth.map(w=>w*.1):null;
  const other=sum(demands.filter((_,i)=>i!==h));
  const bestAgreement=other>target+1e-9?null:Math.max(0,Math.min(caps[h],Math.floor(((target-other)/config.wealth[h]*100+1e-9)*4)/4));
  return {round,target,percentages,demands,total,agreement,finished,payoffs,bestAgreement};
}

// Kim et al. (2025), p. 1415: incoming fines cannot remove more than
// contribution-stage earnings; outgoing punishment costs remain payable.
function civicResolve(contributions,punishments=Array.from({length:4},()=>Array(4).fill(0))) {
  if(contributions.length!==4||punishments.length!==4)throw new RangeError('Four teams are required');
  contributions.forEach(c=>integer(c,0,20,'contribution'));
  punishments.forEach((row,i)=>{if(row.length!==4)throw new RangeError('Four punishment entries required');row.forEach((p,j)=>{integer(p,0,5,'punishment');if(i===j&&p!==0)throw new RangeError('No self punishment');});});
  const total=sum(contributions),gross=contributions.map(c=>20-c+.4*total);
  const sent=punishments.map(sum),received=contributions.map((_,i)=>sum(punishments.map(row=>row[i])));
  const losses=gross.map((g,i)=>Math.min(g,3*received[i]));
  const payoffs=gross.map((g,i)=>Math.max(0,g-3*received[i])-sent[i]);
  return {contributions:[...contributions],punishments:punishments.map(r=>[...r]),total,gross,sent,received,losses,payoffs,destroyed:sum(gross)-sum(payoffs)};
}

// Heyen, Lohse & Tavoni (supplied working paper), Section 2.
function gobConfig(treatment='AL',role='high') {
  if(!['SH','SL','AH','AL'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['high','low'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment[0]==='S',cost=treatment[1]==='H'?11:9;
  const ideals=symmetric?[6,6,6]:[6,3,3],human=symmetric||role==='high'?0:1;
  const equilibrium=cost===11?[0,0,0]:symmetric?[2,2,2]:[6,0,0];
  return {treatment,role,symmetric,cost,ideals,human,equilibrium,efficientTotal:symmetric?6:3};
}
function gobResolve(quantities,ideals,cost,guesses=null) {
  if(quantities.length!==3||ideals.length!==3||![9,11].includes(cost))throw new RangeError('Invalid GoB setup');
  quantities.forEach(q=>integer(q,0,6,'production'));ideals.forEach(a=>{if(![3,6].includes(a))throw new RangeError('Ideal must be 3 or 6');});
  if(guesses){if(guesses.length!==3)throw new RangeError('Three forecasts required');guesses.forEach(g=>integer(g,0,12,'forecast'));}
  const total=sum(quantities),costs=quantities.map(q=>cost*q),mismatch=ideals.map(a=>10*Math.abs(total-a));
  const base=quantities.map((_,i)=>220-costs[i]-mismatch[i]);
  const bonuses=quantities.map((q,i)=>!guesses?0:Math.abs(guesses[i]-(total-q))===0?30:Math.abs(guesses[i]-(total-q))===1?20:0);
  return {quantities:[...quantities],total,costs,mismatch,base,bonuses,payoffs:base.map((p,i)=>p+bonuses[i])};
}
function gobBestResponses(config,human=config.human,others=config.equilibrium) {
  const values=Array.from({length:7},(_,q)=>{const profile=[...others];profile[human]=q;return gobResolve(profile,config.ideals,config.cost).base[human];});
  const maximum=Math.max(...values);return {values,maximum,choices:values.flatMap((v,q)=>v===maximum?[q]:[])};
}

// Schmid, Tavoni & Winkler (October 2026): exact 0.01 contribution grid.
// Integer numerators prevent rounding from fabricating profitable deviations.
function agentNumerator(treatment,b,p,q) {
  if(!['linear','quadratic'].includes(treatment)||!MENU.includes(b))throw new RangeError('Invalid agent parameters');
  integer(p,0,100,'own percentage');integer(q,0,100,'other percentage');const s=p+q;
  return treatment==='linear'?100*b*s-9*p*p:b*(3400*s-9*s*s)-162*p*p;
}
const agentDenominator = treatment => treatment==='linear'?10000:180000;
const agentPayoff = (treatment,b,p,q)=>agentNumerator(treatment,b,p,q)/agentDenominator(treatment);
function agentBestResponses(treatment,b,q) {
  const values=Array.from({length:101},(_,p)=>agentNumerator(treatment,b,p,q)),maximum=Math.max(...values);
  return {choices:values.flatMap((v,p)=>v===maximum?[p]:[]),maximum:maximum/agentDenominator(treatment)};
}
function continuousAgentEquilibrium(treatment,b1,b2) {return treatment==='linear'?[b1/18,b2/18]:[17*b1/(9*(18+b1+b2)),17*b2/(9*(18+b1+b2))];}
const agentCache=new Map();
function agentEquilibria(treatment,b1,b2) {
  const key=`${treatment}/${b1}/${b2}`;if(agentCache.has(key))return agentCache.get(key).map(x=>[...x]);
  const br1=Array.from({length:101},(_,q)=>agentBestResponses(treatment,b1,q).choices),br2=Array.from({length:101},(_,p)=>agentBestResponses(treatment,b2,p).choices),pairs=[];
  for(let p=0;p<=100;p++)for(const q of br2[p])if(br1[q].includes(p))pairs.push([p,q]);
  if(!pairs.length)throw new Error('No pure grid equilibrium');agentCache.set(key,pairs);return pairs.map(x=>[...x]);
}
function selectedAgentEquilibrium(treatment,b1,b2) {
  const exact=continuousAgentEquilibrium(treatment,b1,b2).map(x=>100*x);
  const candidates=agentEquilibria(treatment,b1,b2);
  candidates.sort((a,b)=>{const da=(a[0]-exact[0])**2+(a[1]-exact[1])**2,db=(b[0]-exact[0])**2+(b[1]-exact[1])**2;return Math.abs(da-db)>1e-9?da-db:b1<=b2?a[0]-b[0]:a[1]-b[1];});
  return [...candidates[0]];
}
function delegationOutcome(treatment,b1,b2) {
  const [p,q]=selectedAgentEquilibrium(treatment,b1,b2);
  return {parameters:[b1,b2],contributions:[p,q],agents:[agentPayoff(treatment,b1,p,q),agentPayoff(treatment,b2,q,p)],principals:[agentPayoff(treatment,8,p,q),agentPayoff(treatment,8,q,p)],equilibria:agentEquilibria(treatment,b1,b2)};
}
function principalBestResponses(treatment,other,seat=0) {
  integer(seat,0,1,'principal seat');
  const values=MENU.map(b=>{const [p,q]=seat===0?selectedAgentEquilibrium(treatment,b,other):selectedAgentEquilibrium(treatment,other,b);return seat===0?agentNumerator(treatment,8,p,q):agentNumerator(treatment,8,q,p);}),maximum=Math.max(...values);
  return {values:values.map(v=>v/agentDenominator(treatment)),maximum:maximum/agentDenominator(treatment),choices:MENU.filter((_,i)=>values[i]===maximum)};
}
function principalEquilibria(treatment) {
  return MENU.flatMap(a=>MENU.filter(b=>principalBestResponses(treatment,b,0).choices.includes(a)&&principalBestResponses(treatment,a,1).choices.includes(b)).map(b=>[a,b]));
}

 $:s=>document.querySelector(s),

};

{
const app=UI.$('#app');let settings={treatment:'AL',role:'high',rounds:5,forecast:true},config=null,phase='setup',round=1,choice=0,result=null,scores=[0,0,0],records=[];
const treatmentNames={SH:'Same ideals · high cost',SL:'Same ideals · low cost',AH:'Different ideals · high cost',AL:'Different ideals · low cost'};
UI.guide(`<h2>When “more” becomes worse</h2><p>Three players each receive 220 fresh tokens each period. Every player produces an integer number of units from 0 to 6. Total production Q affects everyone. Each player has an ideal <strong>total</strong>, not a personal production target.</p><p>Your production earnings are <strong>220 − cost × your units − 10 × |total units − your ideal total|</strong>. Cost is 9 or 11 per unit. Every unit above or below your ideal total costs you 10. Other players can push the total past your ideal even when you produce nothing.</p><h3>Four environments, four incentives</h3><ul><li><strong>Same ideals, high cost:</strong> everyone’s ideal is 6, but each unit costs 11 and can improve own mismatch loss by at most 10. All zero is the equilibrium; the efficient total is 6.</li><li><strong>Same ideals, low cost:</strong> everyone’s ideal is 6 and each unit costs 9. Any allocation summing to 6 is a Nash equilibrium. The bots use the balanced profile (2,2,2). Efficiency and equilibrium coincide in total production.</li><li><strong>Different ideals, high cost:</strong> ideals are (6,3,3), cost is 11. The equilibrium is (0,0,0); the efficient total is 3.</li><li><strong>Different ideals, low cost:</strong> ideals are (6,3,3), cost is 9. The unique equilibrium is (6,0,0). The high-ideal player supplies everything and pushes provision above the group-efficient total of 3: this is free-driving.</li></ul><p>Bots repeat these selected production levels and do not respond to your choice. Human deviations need not produce equilibrium play. The best-response table compares only your production earnings against the fixed bots. The efficiency benchmark excludes forecasting bonuses.</p><h3>Forecast bonus</h3><p>When enabled, predict the other two players’ combined production (0–12). An exact forecast earns 30 extra tokens, an error of one earns 20, and a larger error earns zero. Your forecast does not alter production. Each bot predicts the other two players’ on-equilibrium total, even if you deviate. Your default forecast is the disclosed bot total; you can change it. This teaching disclosure makes forecasting easier than in the experiment.</p><h3>Source and teaching choices</h3><p>Heyen, Lohse & Tavoni, <em>Public Gobs in the Lab</em>, supplied working paper dated 13 November 2026. Payoff and design: Sections 2.1–2.3 (pp. 6–11), especially equation (1) and Figure 1.</p><p>This app adapts the repeated C-game. It offers five or ten periods with the same fixed bots. The original C-game has twenty periods in stranger/partner blocks and pays one randomly selected period. Here the session total is an explicitly labelled classroom score, not the original payment rule. The separate P-game, full conditional-production table, matching protocols and experimental recruitment are omitted. The paper and participant data are not redistributed.</p>`);
function begin(){config={...gobConfig(settings.treatment,settings.role),rounds:settings.rounds,forecast:settings.forecast};round=1;scores=[0,0,0];records=[];choice=config.equilibrium[config.human];phase='choice';render();UI.focus();}
function controls(){return `<h2>Patch the environment</h2><label><span>Costs & preferences</span><select id="treatment">${UI.options(Object.entries(treatmentNames),settings.treatment)}</select></label><label><span>Your ideal total</span><select id="role" ${settings.treatment[0]==='S'?'disabled':''}>${UI.options([['high','6 units · high ideal'],['low','3 units · low ideal']],settings.role)}</select></label><label><span>Session length</span><select id="rounds">${UI.options([[5,'5 periods · classroom shortcut'],[10,'10 periods · one original block']],settings.rounds)}</select></label><label class="check"><input type="checkbox" id="forecast-toggle" ${settings.forecast?'checked':''}><span>Include the original forecast bonus: 30 for exact, 20 for one unit off.</span></label><p class="small">Select your preferences and explore a Nash production plan. Your ideal concerns the whole group’s total.</p><button class="primary" id="start">Start the session ↗</button>`;}
function render(){const c=config??gobConfig(settings.treatment,settings.role),h=c.human,otherTotal=sum(c.equilibrium)-c.equilibrium[h],done=config&&phase==='result'&&round===config.rounds;
 let board='',rack='';
 if(!config){rack=controls();board=`<div class="strip"><span>ONE SHARED PRODUCTION LEVEL</span><span>THREE DIFFERENT PAYOFFS</span></div><h2>Turn it up. But who benefits?</h2><p class="small">Each player can add 0–6 units. Production helps someone only until their preferred group total is reached. Past that point, extra units hurt.</p>${players(c,null)}<div class="lesson"><strong>${treatmentNames[c.treatment]}</strong><br>${c.cost===11?'A unit costs 11, while reducing your mismatch loss by at most 10. The selected equilibrium has nobody produce.':c.symmetric?'A unit costs 9 and can reduce your mismatch loss by 10. The bots use a balanced equilibrium: 2 each, making 6 together.':'A unit costs 9. The high-ideal player produces 6 and the two low-ideal players produce 0. The group-efficient total is only 3.'}</div><p class="small">No real production, money or environmental intervention. This is an abstract public Good-or-Bad game.</p>`;}
 else{rack=`<span class="round-pill">PERIOD ${round} / ${config.rounds}</span><h2 style="margin-top:20px">${treatmentNames[c.treatment]}</h2><p class="small">Cost per unit: <strong>${c.cost}</strong><br>Your ideal group total: <strong>${c.ideals[h]}</strong><br>Group-efficient total: <strong>${c.efficientTotal}</strong></p><p class="eyebrow">YOUR CLASSROOM SCORE</p><div class="earnings">${UI.n(scores[h])}<small> tokens</small></div><p class="small">${round-(phase==='choice'?1:0)} settled periods. Every new period starts with 220 fresh tokens. This score is not a contribution budget.</p><div class="lesson"><strong>The bot production plan</strong><br>${c.equilibrium.map((q,i)=>i===h?'':`Player ${i+1}: ${q} units, ideal ${c.ideals[i]}.`).filter(Boolean).join('<br>')}<br>They do not adapt to your choices.</div><button class="text-button" id="reset">Change the environment</button>`;
 if(phase==='choice')board=`<div class="strip"><span>YOUR PRODUCTION CONTROL</span><span>0–6 WHOLE UNITS</span></div><h2>How many units will you add?</h2><div class="knob-area"><div class="knob" id="knob" aria-hidden="true" style="background:conic-gradient(from -135deg,#b46b9d ${choice*45}deg,var(--tint) 0deg)"><div class="knob-face"><span id="knob-value">${choice}</span><small>YOUR UNITS</small></div></div><div class="knob-cost"><p>PRODUCTION COST</p><strong id="cost-value">${c.cost*choice}</strong><p>tokens out of 220.<br>Mismatch losses are calculated<br>after everyone’s choices.</p></div></div><fieldset><legend class="sr-only">Your units to produce</legend><div class="pads">${Array.from({length:7},(_,q)=>`<button type="button" data-units="${q}" aria-label="Produce ${q} units" aria-pressed="${q===choice}" class="${q===choice?'selected':''}">${q}</button>`).join('')}</div></fieldset>${c.forecast?`<div class="forecast"><label for="guess"><strong>Forecast the other two players’ total.</strong><br>Disclosed bot plans imply ${otherTotal} units.</label><input id="guess" type="number" aria-label="Forecast of other players production" min="0" max="12" step="1" value="${otherTotal}"></div>`:''}<button class="primary" id="submit">Commit my production →</button><p class="small muted">Choices are simultaneous. Your forecast cannot change the bots’ production.</p>`;
 if(phase==='result'){const br=gobBestResponses(c,h,result.quantities),baseTotal=sum(result.base),efficientBase=660-c.cost*c.efficientTotal-sum(c.ideals.map(a=>10*Math.abs(c.efficientTotal-a)));board=`<div class="strip"><span>THE GROUP PRODUCED ${result.total} UNITS</span><span>${done?'SESSION COMPLETE':'PERIOD RESOLVED'}</span></div><h2>${result.total>c.efficientTotal?'More production. Less group value.':result.total<c.efficientTotal?'A gap below the group optimum.':'The group reached its efficient total.'}</h2><div class="quantity-gauge"><div class="quantity-track" aria-label="Total production ${result.total}, efficient total ${c.efficientTotal}"><div class="quantity-fill" style="width:${result.total/18*100}%"></div>${[...new Set(c.ideals)].map(a=>`<span class="quantity-marker" style="left:${a/18*100}%"><em>Ideal ${a}</em></span>`).join('')}</div><div class="axis"><span>0 units</span><span>18 units · maximum total</span></div></div>${players(c,result)}<div class="lesson"><strong>You earned ${result.base[h]} from production${c.forecast?` + ${result.bonuses[h]} forecast bonus = ${result.payoffs[h]} tokens`:'.'}</strong><br>220 − ${result.costs[h]} production cost − ${result.mismatch[h]} mismatch loss.${c.forecast?` Your forecast was ${result.guesses[h]}; the other players produced ${result.total-result.quantities[h]}.`:''}<br>${br.choices.includes(result.quantities[h])?'Your production was a best response to these bots.':`Against these fixed bots, producing ${br.choices.join(' or ')} would earn ${br.maximum} before any forecast bonus.`}</div><p class="small">Group production earnings: <strong>${baseTotal}</strong>. Highest possible group production earnings: <strong>${efficientBase}</strong>, at total ${c.efficientTotal}. These totals exclude forecast bonuses; reaching that benchmark can require changing the bots’ choices too.</p><details><summary>Compare all my production choices</summary>${UI.table(['Your units','Your production earnings'],br.values.map((v,q)=>[`${q}${q===result.quantities[h]?' · your choice':''}${br.choices.includes(q)?' · best response':''}`,v]))}</details><details><summary>See everyone’s payoff calculation</summary>${UI.table(['Player','Ideal total','Units','Cost','Mismatch loss','Production earnings','Forecast bonus'],result.quantities.map((q,i)=>[`${i+1}${i===h?' · you':''}`,c.ideals[i],q,result.costs[i],result.mismatch[i],result.base[i],result.bonuses[i]]))}</details><div class="button-row"><button class="primary" id="next">${done?'Try another environment':'Next period'} →</button><button class="secondary" id="csv">Save the session</button></div>`;}
 }
 app.innerHTML=`<header class="dial-header"><a class="dial-brand" href="games.html">THE D<span>i</span>AL.</a><nav class="dial-nav"><a href="games.html">All games</a><button class="text-button" data-guide>Instructions</button></nav></header><main id="main" class="dial-shell"><div class="dial-hero"><div><p class="eyebrow">PUBLIC GOOD-OR-BAD / HEYEN · LOHSE · TAVONI</p><h1>Good for you.<br><em>Good for everyone?</em></h1><p>One shared total. Different ideas of “enough”. Discover free-riding, coordination and free-driving with two equilibrium bots.</p></div><div class="cassette-tag"><span>MORE ISN’T</span><strong>always</strong><span>BETTER.</span></div></div><div class="studio"><aside class="control-rack">${rack}</aside><section class="studio-board" aria-label="Production studio">${board}</section></div><footer class="dial-footer"><span>Based on <em>Public Gobs in the Lab</em>, supplied working paper. Fictional tokens.</span><button class="text-button" data-guide>Instructions</button></footer></main>`;
 UI.on('treatment','change',e=>{settings.treatment=e.target.value;render();});UI.on('role','change',e=>{settings.role=e.target.value;render();});UI.on('rounds','change',e=>settings.rounds=Number(e.target.value));UI.on('forecast-toggle','change',e=>settings.forecast=e.target.checked);UI.on('start','click',begin);
 document.querySelectorAll('[data-units]').forEach(button=>button.addEventListener('click',()=>{choice=Number(button.dataset.units);document.querySelectorAll('[data-units]').forEach(b=>{const selected=Number(b.dataset.units)===choice;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',selected);});UI.$('#knob-value').textContent=choice;UI.$('#cost-value').textContent=choice*c.cost;UI.$('#knob').style.background=`conic-gradient(from -135deg,#b46b9d ${choice*45}deg,var(--tint) 0deg)`;}));
 UI.on('submit','click',()=>{if(c.forecast&&!UI.$('#guess').reportValidity())return;const quantities=[...c.equilibrium];quantities[h]=choice;const guesses=c.forecast?c.equilibrium.map((q,i)=>sum(c.equilibrium)-q):null;if(guesses)guesses[h]=Number(UI.$('#guess').value);result={...gobResolve(quantities,c.ideals,c.cost,guesses),guesses};scores=scores.map((s,i)=>s+result.payoffs[i]);quantities.forEach((q,i)=>records.push({period:round,treatment:c.treatment,player:i+1,human:i===h,ideal_total:c.ideals[i],unit_cost:c.cost,units:q,total_units:result.total,production_cost:result.costs[i],mismatch_loss:result.mismatch[i],production_earnings:result.base[i],forecast:guesses?.[i]??'',forecast_bonus:result.bonuses[i],payoff:result.payoffs[i],classroom_score:scores[i]}));phase='result';render();UI.focus();});
 UI.on('next','click',()=>{if(done){config=null;phase='setup';}else{round++;phase='choice';choice=c.equilibrium[h];}render();UI.focus();});UI.on('reset','click',()=>{config=null;phase='setup';render();UI.focus();});UI.on('csv','click',()=>UI.csv('the-dial-session.csv',records));
}
function players(c,outcome){return `<div class="players">${c.ideals.map((ideal,i)=>`<div class="player ${ideal===6&&!c.symmetric?'high':''} ${i===c.human?'you':''}"><span>PLAYER ${i+1}${i===c.human?' / YOU':' / BOT'}</span><strong>${outcome?outcome.quantities[i]:c.equilibrium[i]} <small>${outcome?'UNITS PRODUCED':'UNITS IN SELECTED NASH PLAN'}</small></strong><small>Ideal group total: ${ideal}${outcome?`<br>Production earnings: ${outcome.base[i]}`:''}</small></div>`).join('')}</div>`;}
render();

}
</script></body></html>
