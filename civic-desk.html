// Original classroom implementations. Source PDFs are not distributed.
const sum = xs => xs.reduce((a,b)=>a+b,0);
function integer(value,min,max,label='value') { if(!Number.isInteger(value)||value<min||value>max)throw new RangeError(`${label} must be an integer from ${min} to ${max}`);return value; }
const MENU = [4,6,8,10,12];

// Gosnell & Tavoni (2017): demands are percentages of ORIGINAL wealth.
function bargainConfig(treatment='ASYM',role='poor') {
  if(!['SYM','ASYM','PSD','RSD','ASD'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['poor','rich'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment==='SYM';
  return {treatment,role,human:symmetric?0:role==='rich'?0:2,wealth:symmetric?Array(6).fill(100/6):[30,30,10,10,10,10]};
}
function bargainTarget(round) {integer(round,1,8,'round');return 60-10*Math.floor((round-1)/2);}
function bargainGroups(treatment) {return [...(['RSD','ASD'].includes(treatment)?[[0,1]]:[]),...(['PSD','ASD'].includes(treatment)?[[2,3,4,5]]:[])];}
function bargainCaps(config,round,humanVote=100) {
  integer(humanVote,0,100,'side-deal vote');
  const target=bargainTarget(round),caps=Array(6).fill(100),deals=[];
  for(const members of bargainGroups(config.treatment)) {
    const votes=members.map(i=>i===config.human?humanVote:target),cap=sum(votes)/members.length;
    members.forEach(i=>caps[i]=cap);deals.push({members,votes,cap});
  }
  return {caps,deals};
}
function bargainResolve(config,round,caps,humanDemand) {
  const target=bargainTarget(round),h=config.human;
  if(caps.length!==6||caps.some(c=>!Number.isFinite(c)||c<0||c>100))throw new RangeError('Invalid caps');
  if(!Number.isFinite(humanDemand)||humanDemand<0||humanDemand>caps[h]+1e-9||Math.abs(humanDemand*4-Math.round(humanDemand*4))>1e-7)throw new RangeError('Demand must be a legal quarter percentage point');
  const percentages=caps.map((cap,i)=>i===h?humanDemand:Math.min(target,cap));
  const demands=percentages.map((p,i)=>p*config.wealth[i]/100),total=sum(demands),agreement=total<=target+1e-9;
  const finished=agreement||round===8,payoffs=agreement?demands:finished?config.wealth.map(w=>w*.1):null;
  const other=sum(demands.filter((_,i)=>i!==h));
  const bestAgreement=other>target+1e-9?null:Math.max(0,Math.min(caps[h],Math.floor(((target-other)/config.wealth[h]*100+1e-9)*4)/4));
  return {round,target,percentages,demands,total,agreement,finished,payoffs,bestAgreement};
}

// Kim et al. (2025), p. 1415: incoming fines cannot remove more than
// contribution-stage earnings; outgoing punishment costs remain payable.
function civicResolve(contributions,punishments=Array.from({length:4},()=>Array(4).fill(0))) {
  if(contributions.length!==4||punishments.length!==4)throw new RangeError('Four teams are required');
  contributions.forEach(c=>integer(c,0,20,'contribution'));
  punishments.forEach((row,i)=>{if(row.length!==4)throw new RangeError('Four punishment entries required');row.forEach((p,j)=>{integer(p,0,5,'punishment');if(i===j&&p!==0)throw new RangeError('No self punishment');});});
  const total=sum(contributions),gross=contributions.map(c=>20-c+.4*total);
  const sent=punishments.map(sum),received=contributions.map((_,i)=>sum(punishments.map(row=>row[i])));
  const losses=gross.map((g,i)=>Math.min(g,3*received[i]));
  const payoffs=gross.map((g,i)=>Math.max(0,g-3*received[i])-sent[i]);
  return {contributions:[...contributions],punishments:punishments.map(r=>[...r]),total,gross,sent,received,losses,payoffs,destroyed:sum(gross)-sum(payoffs)};
}

// Heyen, Lohse & Tavoni (supplied working paper), Section 2.
function gobConfig(treatment='AL',role='high') {
  if(!['SH','SL','AH','AL'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['high','low'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment[0]==='S',cost=treatment[1]==='H'?11:9;
  const ideals=symmetric?[6,6,6]:[6,3,3],human=symmetric||role==='high'?0:1;
  const equilibrium=cost===11?[0,0,0]:symmetric?[2,2,2]:[6,0,0];
  return {treatment,role,symmetric,cost,ideals,human,equilibrium,efficientTotal:symmetric?6:3};
}
function gobResolve(quantities,ideals,cost,guesses=null) {
  if(quantities.length!==3||ideals.length!==3||![9,11].includes(cost))throw new RangeError('Invalid GoB setup');
  quantities.forEach(q=>integer(q,0,6,'production'));ideals.forEach(a=>{if(![3,6].includes(a))throw new RangeError('Ideal must be 3 or 6');});
  if(guesses){if(guesses.length!==3)throw new RangeError('Three forecasts required');guesses.forEach(g=>integer(g,0,12,'forecast'));}
  const total=sum(quantities),costs=quantities.map(q=>cost*q),mismatch=ideals.map(a=>10*Math.abs(total-a));
  const base=quantities.map((_,i)=>220-costs[i]-mismatch[i]);
  const bonuses=quantities.map((q,i)=>!guesses?0:Math.abs(guesses[i]-(total-q))===0?30:Math.abs(guesses[i]-(total-q))===1?20:0);
  return {quantities:[...quantities],total,costs,mismatch,base,bonuses,payoffs:base.map((p,i)=>p+bonuses[i])};
}
function gobBestResponses(config,human=config.human,others=config.equilibrium) {
  const values=Array.from({length:7},(_,q)=>{const profile=[...others];profile[human]=q;return gobResolve(profile,config.ideals,config.cost).base[human];});
  const maximum=Math.max(...values);return {values,maximum,choices:values.flatMap((v,q)=>v===maximum?[q]:[])};
}

// Schmid, Tavoni & Winkler (October 2026): exact 0.01 contribution grid.
// Integer numerators prevent rounding from fabricating profitable deviations.
function agentNumerator(treatment,b,p,q) {
  if(!['linear','quadratic'].includes(treatment)||!MENU.includes(b))throw new RangeError('Invalid agent parameters');
  integer(p,0,100,'own percentage');integer(q,0,100,'other percentage');const s=p+q;
  return treatment==='linear'?100*b*s-9*p*p:b*(3400*s-9*s*s)-162*p*p;
}
const agentDenominator = treatment => treatment==='linear'?10000:180000;
const agentPayoff = (treatment,b,p,q)=>agentNumerator(treatment,b,p,q)/agentDenominator(treatment);
function agentBestResponses(treatment,b,q) {
  const values=Array.from({length:101},(_,p)=>agentNumerator(treatment,b,p,q)),maximum=Math.max(...values);
  return {choices:values.flatMap((v,p)=>v===maximum?[p]:[]),maximum:maximum/agentDenominator(treatment)};
}
function continuousAgentEquilibrium(treatment,b1,b2) {return treatment==='linear'?[b1/18,b2/18]:[17*b1/(9*(18+b1+b2)),17*b2/(9*(18+b1+b2))];}
const agentCache=new Map();
function agentEquilibria(treatment,b1,b2) {
  const key=`${treatment}/${b1}/${b2}`;if(agentCache.has(key))return agentCache.get(key).map(x=>[...x]);
  const br1=Array.from({length:101},(_,q)=>agentBestResponses(treatment,b1,q).choices),br2=Array.from({length:101},(_,p)=>agentBestResponses(treatment,b2,p).choices),pairs=[];
  for(let p=0;p<=100;p++)for(const q of br2[p])if(br1[q].includes(p))pairs.push([p,q]);
  if(!pairs.length)throw new Error('No pure grid equilibrium');agentCache.set(key,pairs);return pairs.map(x=>[...x]);
}
function selectedAgentEquilibrium(treatment,b1,b2) {
  const exact=continuousAgentEquilibrium(treatment,b1,b2).map(x=>100*x);
  const candidates=agentEquilibria(treatment,b1,b2);
  candidates.sort((a,b)=>{const da=(a[0]-exact[0])**2+(a[1]-exact[1])**2,db=(b[0]-exact[0])**2+(b[1]-exact[1])**2;return Math.abs(da-db)>1e-9?da-db:b1<=b2?a[0]-b[0]:a[1]-b[1];});
  return [...candidates[0]];
}
function delegationOutcome(treatment,b1,b2) {
  const [p,q]=selectedAgentEquilibrium(treatment,b1,b2);
  return {parameters:[b1,b2],contributions:[p,q],agents:[agentPayoff(treatment,b1,p,q),agentPayoff(treatment,b2,q,p)],principals:[agentPayoff(treatment,8,p,q),agentPayoff(treatment,8,q,p)],equilibria:agentEquilibria(treatment,b1,b2)};
}
function principalBestResponses(treatment,other,seat=0) {
  integer(seat,0,1,'principal seat');
  const values=MENU.map(b=>{const [p,q]=seat===0?selectedAgentEquilibrium(treatment,b,other):selectedAgentEquilibrium(treatment,other,b);return seat===0?agentNumerator(treatment,8,p,q):agentNumerator(treatment,8,q,p);}),maximum=Math.max(...values);
  return {values:values.map(v=>v/agentDenominator(treatment)),maximum:maximum/agentDenominator(treatment),choices:MENU.filter((_,i)=>values[i]===maximum)};
}
function principalEquilibria(treatment) {
  return MENU.flatMap(a=>MENU.filter(b=>principalBestResponses(treatment,b,0).choices.includes(a)&&principalBestResponses(treatment,a,1).choices.includes(b)).map(b=>[a,b]));
}

const UI={
 $:s=>document.querySelector(s),
 n:(v,d=2)=>Number(v).toLocaleString('en-GB',{maximumFractionDigits:d}),
 money:v=>'£'+Number(v).toFixed(2),
 on:(id,event,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(event,fn);},
 guide:content=>{const dialog=document.getElementById('guide');dialog.innerHTML=`<div class="guide-head"><strong>FIELD GUIDE</strong><button id="close-guide" aria-label="Close guide">Close ×</button></div>${content}<p class="privacy">Fictional earnings. Choices remain in browser memory and reset on refresh. CSV exports are created on your device. There are no analytics or game backend; the website host may keep ordinary access logs.</p>`;document.addEventListener('click',event=>{if(event.target.closest('[data-guide]'))dialog.showModal();if(event.target.closest('#close-guide'))dialog.close();});},
 csv:(filename,records)=>{if(!records.length)return;const keys=Object.keys(records[0]),quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const text=[keys.map(quote).join(','),...records.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},
 focus:()=>{const heading=document.querySelector('main h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}},
 options:(values,current)=>values.map(([value,label])=>`<option value="${value}" ${String(value)===String(current)?'selected':''}>${label}</option>`).join(''),
 table:(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
};

{
const app=UI.$('#app');let settings={treatment:'RM',seat:'rep',punishment:true,rounds:5},config=null,phase='setup',round=1,scores=[0,0,0,0],contributions=[0,0,0,0],advice=0,result=null,records=[];
const guide=`<h2>Whose decision is it?</h2><p>There are four teams. In NoR each team is one self-representing person. In RnoM and RM each team has three members and a representative chooses for the whole team. A team payoff of 20 means <strong>20 for each member</strong>, not 20 divided among three.</p><h3>Contribution stage</h3><p>Every team receives 20 fresh points each period. Its contribution C can be any whole number from 0 to 20. Each team’s contribution-stage payoff is <strong>20 − own contribution + 0.4 × the sum of all four contributions</strong>. All choices are simultaneous. Full contributions yield 32 per member in every team; all zero contributions yield 20.</p><h3>Messages and representation</h3><p>In RM, the two non-representatives each suggest a contribution and, later, punishments. The representative sees these numbers but need not follow them. In RnoM, preferences are elicited but not shared. They do not directly change payoffs. This app lets you hold either the representative seat or a non-representative seat for the whole session. As a member you submit advice; the bot representative still chooses zero. In NoR you decide for yourself.</p><h3>Punishment stage</h3><p>If selected, this stage follows disclosure of contributions. Each team may assign 0–5 punishment points to each other team. Each point costs the sender 1 and reduces the recipient’s contribution-stage earnings by 3. Incoming fines cannot take contribution-stage earnings below zero; your outgoing costs are then deducted and can make your period payoff negative. Formula: <strong>max(0, contribution earnings − 3 × incoming punishment points) − outgoing points</strong>. There is no retaliation stage. Each team receives a one-time 40-point opening balance in a punishment block, replicated to every member.</p><h3>The equilibrium benchmark</h3><p>Under selfish monetary-payoff maximization, costly punishment is not optimal at its stage. Knowing this, a representative keeps all 20: each contributed point returns only 0.4 to their own team. The selected bots contribute zero and punish zero every period, including after your deviations. Messages are zero; because messages are cheap talk, other messages can be payoff-equivalent. These actions form the paper’s subgame-perfect contribution/punishment benchmark for a finite block. Human participants in the paper often contributed and punished; those observations are <strong>not</strong> what the equilibrium bots simulate.</p><h3>Research and adaptations</h3><p>Kim, İriş, Lee & Tavoni (2025), <em>Representation, Peer Pressure and Punishment in a Public Goods Game</em>, Environmental and Resource Economics 88, 1407–1433. Sections 3.1–3.4, especially p. 1415. <a href="https://doi.org/10.1007/s10640-025-00970-6" target="_blank" rel="noopener noreferrer">Research paper ↗</a>.</p><p>The study uses two ten-period blocks, with and without punishment, random representatives each period and changing team labels. Here you choose one five- or ten-period block, retain your seat, keep stable team labels and see bot plans and counterfactuals. There is no claim that the bot comparison measures the causal effects reported in the experiment.</p>`;UI.guide(guide);
function begin(){config={...settings,seat:settings.treatment==='NoR'?'rep':settings.seat};round=1;scores=Array(4).fill(config.punishment?40:0);records=[];phase='contribution';render();UI.focus();}
function settle(){const punishment=Array.from({length:4},()=>Array(4).fill(0));const recommendations=[0,0,0,0];if(config.punishment)for(let i=1;i<4;i++){const v=Number(UI.$('#p'+i).value);integer(v,0,5);recommendations[i]=v;if(config.seat==='rep')punishment[0][i]=v;}result=civicResolve(contributions,punishment);scores=scores.map((s,i)=>s+result.payoffs[i]);for(let i=0;i<4;i++)records.push({period:round,treatment:config.treatment,seat:config.seat,punishment_block:config.punishment,team:i+1,contribution:contributions[i],human_contribution_advice:i===0?advice:'',outgoing_cost:result.sent[i],incoming_points:result.received[i],incoming_loss:result.losses[i],period_payoff_per_member:result.payoffs[i],cumulative_per_member:scores[i],opening_balance:config.punishment?40:0,human_punishment_advice:i===0?recommendations.slice(1).join('/'):''});phase='result';render();UI.focus();}
function render(){const c=config??settings,k=c.treatment==='NoR'?1:3,member=c.seat==='member'&&c.treatment!=='NoR',done=config&&phase==='result'&&round===config.rounds;
 let content='';
 if(!config)content=`<h2>Open a new case</h2><div class="form-grid"><label><span>Representation</span><select id="treatment">${UI.options([['NoR','NoR · decide for yourself'],['RnoM','RnoM · representatives, no messages'],['RM','RM · representatives + messages']],settings.treatment)}</select></label><label><span>Your seat</span><select id="seat" ${settings.treatment==='NoR'?'disabled':''}>${UI.options([['rep','Representative · make decisions'],['member','Team member · give advice']],settings.seat)}</select></label><label><span>Session length</span><select id="rounds">${UI.options([[5,'5 periods · classroom shortcut'],[10,'10 periods · one original block']],settings.rounds)}</select></label></div><label class="checkline"><input type="checkbox" id="punishment" ${settings.punishment?'checked':''}><span>Include the punishment stage<br><small>0–5 points per target, at a cost of 1 each.</small></span></label><div class="office-rule">Your three opposing teams use the selfish equilibrium: <strong>zero contributions and zero punishments</strong>. In team treatments, bot representatives follow this rule even when you send different advice.</div><button class="primary" id="start">Open the session →</button>`;
 else{content=`<div class="stage-tabs"><span class="${phase==='contribution'?'active':''}">01 Contribution</span>${config.punishment?`<span class="${phase==='punish'?'active':''}">02 Punishment</span>`:''}<span class="${phase==='result'?'active':''}">03 Record</span></div>`;
 if(phase==='contribution')content+=`<h2>${member?'Your advice to the representative':'How much should your team contribute?'}</h2>${config.treatment==='RM'&&!member?'<div class="inbox"><div class="memo"><strong>Member B · suggestion</strong>Contribute 0 points.</div><div class="memo"><strong>Member C · suggestion</strong>Contribute 0 points.</div></div>':''}${member?`<div class="office-rule">${config.treatment==='RM'?'Your suggestion will be shared with your representative. It is nonbinding.':'Your preference is recorded but not shown to your representative.'} The bot representative chooses 0.</div>`:config.treatment==='RnoM'?'<p class="small">Your teammates’ preferences are not shown in this treatment.</p>':''}<label><span>${member?'Suggested contribution':'Your team’s contribution'} · 0–20 points</span><div class="value-input"><input id="contribution" type="number" min="0" max="20" step="1" value="0"><span>Fresh endowment: 20 per team.<br>Each contributed point returns 0.4 to each team.</span></div></label><input type="range" id="contribution-range" aria-label="Contribution slider" min="0" max="20" step="1" value="0"><p class="small" id="preview">${member?'Advice does not transfer points.':'Your team keeps 20 before the public return.'}</p><button class="primary" id="submit-contribution">${member?'Send my suggestion':'Confirm contribution'} →</button><p class="small muted">Other teams’ simultaneous choices are shown after you submit.</p>`;
 if(phase==='punish')content+=`<h2>${member?'Would you recommend punishment?':'Would you pay to punish?'}</h2><p class="small">Contribution choices are now public. Your team contributed ${contributions[0]}; all three other teams contributed 0. Your contribution-stage payoff is ${UI.n(20-.6*contributions[0])} per member.</p>${config.treatment==='RM'&&!member?'<div class="inbox"><div class="memo"><strong>Member B</strong>Suggests no punishment.</div><div class="memo"><strong>Member C</strong>Suggests no punishment.</div></div>':''}<div class="office-rule">${member?'These are nonbinding recommendations. Your bot representative allocates no punishment.':'Each point you assign costs your team 1 and removes up to 3 from the target’s contribution earnings.'} Bots allocate no punishment to you.</div><div class="allocation-list">${[1,2,3].map(i=>`<label><span>Team ${String.fromCharCode(65+i)} · ${member?'suggested':'assigned'} punishment</span><input id="p${i}" aria-label="Punishment for team ${String.fromCharCode(65+i)}" type="number" min="0" max="5" step="1" value="0"></label>`).join('')}</div><p class="small">Maximum 5 per target. There is no further retaliation stage.</p><button class="primary" id="submit-punishment">${member?'Send punishment advice':'Confirm punishment'} →</button>`;
 if(phase==='result'){const own=result.payoffs[0],best=member?own:20;content+=`<span class="stamp">PERIOD ${round} SETTLED</span><h2>${done?'Session complete. Review the record.':`Your team earned ${UI.n(own)} per member.`}</h2><div class="payoff-line"><span>Private account retained</span><strong>${20-contributions[0]}</strong></div><div class="payoff-line"><span>Your share of the public account</span><strong>+${UI.n(.4*result.total)}</strong></div><div class="payoff-line"><span>Incoming punishment loss</span><strong>−${UI.n(result.losses[0])}</strong></div><div class="payoff-line"><span>Outgoing punishment cost</span><strong>−${result.sent[0]}</strong></div><div class="payoff-line total"><span>Period earnings per member</span><strong>${UI.n(own)}</strong></div><div class="office-rule">${member?'Your advice did not bind your representative. Different numerical advice would give the same payoff against this bot.':`Keeping all 20 and assigning no punishment would earn ${best} this period against these fixed bots. ${Math.abs(own-best)<1e-9?'Your choices are a best response.':'Contributions and punishment reduced your own earnings in this round.'}`}<br>With all four teams contributing 20 and no sanctions, every member would instead earn 32. That comparison changes everyone’s actions.</div>${UI.table(['Team','Contribution','Earnings / member'],contributions.map((v,i)=>[`Team ${String.fromCharCode(65+i)}${i===0?' · you':''}`,v,UI.n(result.payoffs[i])]))}<div class="button-row"><button class="primary" id="next">${done?'Open a new session':'Continue to period '+(round+1)} →</button><button class="secondary" id="csv">Download the record</button></div>`;}
 }
 const names=['A · your team','B','C','D'];const teamCards=names.map((name,i)=>`<div class="team-card ${i===0?'you':''}"><p class="team-name">TEAM ${name}</p><div class="people" aria-label="${k} ${k===1?'person':'members'}">${'●'.repeat(k)}</div><div class="balance">${UI.n(config?scores[i]:settings.punishment?40:0)}</div><small>${config?'Accumulated points':'Opening balance'} / member<br>${k===3?'Same earnings for all 3 members':'Self-representation'}</small></div>`).join('');
 app.innerHTML=`<header class="office-header"><div class="inside"><a class="office-logo" href="games.html">CIVIC DESK<small>THE REPRESENTATION LAB</small></a><nav class="office-nav"><a href="games.html">All games</a><button class="text-button" data-guide>Field guide ↗</button></nav></div></header><main id="main" class="office-main"><div class="office-title"><div><p class="eyebrow">KIM · İRİŞ · LEE · TAVONI / 2025</p><h1>${!config?'One decision.<br>Three people live with it.':member?'You have a voice.<br>Who has the final say?':'You hold the team’s decision.'}</h1><p>${!config?'Represent your team, or send advice to its representative. Explore who contributes, who punishes and who bears the cost.':'Four teams. Simultaneous choices. Fresh endowments every period.'}</p></div><div class="case-label">${!config?'CASE FILE / READY':`${config.treatment} / PERIOD ${round} OF ${config.rounds}`}</div></div><div class="office-grid"><section class="panel" aria-label="Your decision">${content}</section><aside class="panel"><p class="eyebrow">EARNINGS REGISTER</p><h2>Four teams. Equal rules.</h2><div class="team-grid">${teamCards}</div><p class="small">Every team receives 20 new points each period. ${c.punishment?'The 40-point opening balance is added once at the start of this punishment block.':''} Earnings shown are per member; they are not divided among teammates.</p><div class="office-rule"><strong>The bot policy</strong><br>Contribute 0. Punish 0. Send 0 as advice. This is a monetary equilibrium benchmark, not a model of the paper’s observed human behaviour.</div>${config?'<button class="text-button" id="reset">Change the setup</button>':''}</aside></div><footer class="office-footer"><span>Based on Kim et al. (2025). Fictional points. ${config?config.rounds:settings.rounds}-period teaching block.</span><button class="text-button" data-guide>Payoff rules & research ↗</button></footer></main>`;
 UI.on('treatment','change',e=>{settings.treatment=e.target.value;render();});UI.on('seat','change',e=>settings.seat=e.target.value);UI.on('rounds','change',e=>settings.rounds=Number(e.target.value));UI.on('punishment','change',e=>{settings.punishment=e.target.checked;render();});UI.on('start','click',begin);
 const sync=(a,b)=>{const v=Number(UI.$(a).value);UI.$(b).value=v;UI.$('#preview').textContent=member?'Advice does not transfer points.':`Your team keeps ${20-v} before the public return.`;};UI.on('contribution','input',()=>sync('#contribution','#contribution-range'));UI.on('contribution-range','input',()=>sync('#contribution-range','#contribution'));
 UI.on('submit-contribution','click',()=>{if(!UI.$('#contribution').reportValidity())return;advice=Number(UI.$('#contribution').value);contributions=[member?0:advice,0,0,0];if(config.punishment){phase='punish';render();UI.focus();}else settle();});
 UI.on('submit-punishment','click',()=>{if([1,2,3].every(i=>UI.$('#p'+i).reportValidity()))settle();});UI.on('next','click',()=>{if(done){config=null;phase='setup';}else{round++;phase='contribution';}render();UI.focus();});UI.on('reset','click',()=>{config=null;phase='setup';render();UI.focus();});UI.on('csv','click',()=>UI.csv('civic-desk-record.csv',records));
}
render();

}
</script></body></html>
