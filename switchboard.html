</style></head><body><a class="skip" href="#main">Skip to game</a><div id="app"></div><dialog id="guide" aria-label="Rules, bots and research"></dialog><noscript>This game needs JavaScript. Enable it to play.</noscript><script type="module">const OPTIONS = ['A','B','C','D','E','F','G'];
const MODES = ['stay','switch','mixed'];
function validateConfig(c) {
  if (![8,16].includes(c.n) || !['group','pair'].includes(c.weight) || !MODES.includes(c.mode) || ![5,21].includes(c.length)) throw new Error('Invalid game settings');
  if (!OPTIONS.slice(0,4).includes(c.old) || !OPTIONS.slice(4).includes(c.fresh)) throw new Error('Invalid convention');
  return c;
}
const maximum = option => OPTIONS.indexOf(option)<4 ? 420 : 600;
const available = phase => OPTIONS.slice(0,phase===1?4:7);
const weights = type => type==='group' ? {alpha:.1,beta:.9} : {alpha:.9,beta:.1};
function probabilities(phase,mode,old,fresh) {
  const p=Object.fromEntries(OPTIONS.map(x=>[x,0]));
  if (mode==='mixed') for(const x of available(phase)) p[x]=phase===1?1/4:(maximum(x)===420?10:7)/61;
  else p[phase===2&&mode==='switch'?fresh:old]=1;
  return p;
}
function choose(p,random=Math.random) {
  const draw=random(); let sum=0,last;
  for(const [x,prob] of Object.entries(p)) if(prob>0){last=x;sum+=prob;if(draw<sum)return x;}
  return last;
}
function expectedPayoff(option,otherCounts,n) {return maximum(option)*(otherCounts[option]||0)/(n-1);}
function mixingPayoff(option,p) {return maximum(option)*(p[option]||0);}
function payoff(option,partner,others,type) {
  const {alpha,beta}=weights(type),mu=maximum(option),matches=others.filter(x=>x===option).length;
  const pair=partner===option?mu*alpha:0, group=mu*beta*matches/others.length;
  return {pair,group,total:pair+group,matches,partnerMatch:partner===option};
}
function round(c,phase,choice,random=Math.random) {
  validateConfig(c); if(!available(phase).includes(choice))throw new Error('Choice unavailable in this phase');
  const p=probabilities(phase,c.mode,c.old,c.fresh);
  const botChoices=Array.from({length:c.n-1},()=>choose(p,random));
  // The human's partner is uniformly rematched before choices are revealed.
  const partnerIndex=Math.floor(random()*(c.n-1));
  const others=botChoices.filter((_,i)=>i!==partnerIndex),partner=botChoices[partnerIndex];
  return {choice,phase,...payoff(choice,partner,others,c.weight),partner,partnerIndex,botChoices,others,p};
}
function tipping(n,newOthers) {
  if(![8,16].includes(n)||!Number.isInteger(newOthers)||newOthers<0||newOthers>n-1)throw new Error('Invalid calculator population');
  const newPay=600*newOthers/(n-1),oldPay=420*(n-1-newOthers)/(n-1);
  return {newPay,oldPay,best:newPay>oldPay?'new':newPay<oldPay?'old':'tie',threshold:n/2-1};
}
function shuffled(a,random=Math.random) {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function csv(rows,c) {
  const head=['period','phase','option','partner_match','other_matches','other_members','pair_points','group_points','total_points','community_size','payoff_weight','bot_mode'];
  return [head.join(','),...rows.map((r,i)=>[i+1,r.phase,r.choice,Number(r.partnerMatch),r.matches,c.n-2,r.pair.toFixed(6),r.group.toFixed(6),r.total.toFixed(6),c.n,c.weight,c.mode].join(','))].join('\r\n');
}

const $=s=>document.querySelector(s),fmt=x=>x.toLocaleString('en-GB',{maximumFractionDigits:2,minimumFractionDigits:0});
let config={n:8,weight:'group',mode:'switch',length:5,old:choose({A:.25,B:.25,C:.25,D:.25}),fresh:choose({E:1/3,F:1/3,G:1/3})};
let phase=1,rows=[],selected=null,result=null,view='play',calcN=8,calcCount=3,order=shuffled(OPTIONS.slice(0,4)),inspect=-1;
const modeNames={stay:'Keep the old convention',switch:'Coordinate a switch',mixed:'Randomize in equilibrium'};
const glyphs=[
 '<circle cx="20" cy="20" r="13"/><path d="M7 20h26M20 7v26"/>',
 '<path d="m20 4 16 16-16 16L4 20Z"/><circle cx="20" cy="20" r="7"/>',
 '<path d="M5 8h30v24H5zM5 20h30M13 8v24M27 8v24"/>',
 '<path d="m20 5 15 27H5Z"/><path d="M12 19h16M20 5v27"/>',
 '<circle cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="7"/><path d="M20 1v8M20 31v8M1 20h8M31 20h8"/>',
 '<path d="m20 3 15 9v16l-15 9-15-9V12Z"/><path d="m5 12 15 8 15-8M20 20v17M20 20V3"/>',
 '<path d="M5 6h12v11h18v17H23V23H5Z"/><path d="M5 6 35 34M35 6 5 34"/>'
];
const icon=o=>`<span class="glyph" aria-hidden="true"><svg viewBox="0 0 40 40">${glyphs[OPTIONS.indexOf(o)]}</svg></span>`;
const phaseRows=()=>rows.filter(r=>r.phase===phase).length;
const done=()=>phase===2&&phaseRows()===config.length&&result;
const botPlan=()=>config.mode==='mixed'?`Each bot draws independently. Phase 1: 25% per old option. Phase 2: 16.39% per old option, 11.48% per new option.`:`All bots choose ${config.old} in Phase 1. In Phase 2 they ${config.mode==='switch'?`switch together to ${config.fresh}`:`keep choosing ${config.old}`}. Their plan is fixed, even if you choose differently.`;
function board(){
 const statuses=result?[true,result.partnerMatch,...Array.from({length:config.n-2},(_,i)=>i<result.matches)]:Array(config.n).fill(null);
 return `<div class="board" aria-label="Your community: ${config.n} players"><div class="nodes">${statuses.map((s,i)=>`<div class="node ${s===true?'match':s===false?'miss':''}"><div class="node-dot">${i===0?(result?result.choice:'◎'):result?(s?'●':'−'):'?'}</div><span class="node-label">${i===0?'YOU':i===1?'PARTNER':'OTHER'}</span></div>`).join('')}</div><p class="board-note">${result?'Lit dots = selected the same option as you. Positions are illustrative.':'ONE COMMUNITY · A RANDOM PARTNER EACH PERIOD · CHOICES HIDDEN'}</p></div>`;
}
function controls(){return `<aside class="side" aria-label="Session settings"><h2>Your experiment</h2><label class="field"><span>Community size</span><select id="size"><option value="8" ${config.n===8?'selected':''}>8 players · you + 7 bots</option><option value="16" ${config.n===16?'selected':''}>16 players · you + 15 bots</option></select></label><label class="field"><span>What earns most of your points?</span><select id="weight"><option value="group" ${config.weight==='group'?'selected':''}>Group · 90% other members</option><option value="pair" ${config.weight==='pair'?'selected':''}>Pair · 90% matched partner</option></select></label><label class="field"><span>Bot equilibrium</span><select id="mode">${MODES.map(m=>`<option value="${m}" ${config.mode===m?'selected':''}>${modeNames[m]}</option>`).join('')}</select></label><label class="field"><span>Session length</span><select id="length"><option value="5" ${config.length===5?'selected':''}>Classroom · 5 + 5 periods</option><option value="21" ${config.length===21?'selected':''}>Paper · 21 + 21 periods</option></select></label><button class="ghost" id="restart">Start new session</button><p id="settings-note" class="quiet" hidden>New settings apply when you restart; this clears the current score.</p><div class="plan"><strong>Know the bots’ plan</strong><p>${botPlan()}</p><p>These are selected Nash strategies, not simulated human participants. A pre-agreed switch illustrates an equilibrium change; it does not predict a social tipping process.</p></div><div class="score"><div><div class="value">${fmt(rows.reduce((a,r)=>a+r.total,0))}</div><div class="caption">YOUR POINTS · NO REAL MONEY</div></div><span class="phase-tag">${rows.length}/${config.length*2}</span></div><div class="status-line"><span>${config.weight==='group'?'G':'P'}${config.n} treatment</span><span>${config.mode==='mixed'?'Mixed':'Pure'} Nash bots</span></div></aside>`;}
function feedback(){if(!result)return '';const exp=mixingPayoff(result.choice,result.p);return `<section class="feedback" aria-label="Period result"><h3>${result.total===0?'No match this time.':`You earned ${fmt(result.total)} points.`}</h3><p>Your partner ${result.partnerMatch?'chose the same option':'chose a different option'}. Of the ${config.n-2} other members, ${result.matches} chose your option.</p><dl class="breakdown"><div><dt>Matched partner</dt><dd>${fmt(result.pair)}</dd></div><div><dt>Other members</dt><dd>${fmt(result.group)}</dd></div><div><dt>This period</dt><dd>${fmt(result.total)}</dd></div></dl><p>${maximum(result.choice)} × (${weights(config.weight).alpha} × ${Number(result.partnerMatch)} + ${weights(config.weight).beta} × ${result.matches}/${config.n-2}) = ${fmt(result.total)} points.</p><p>${config.mode==='mixed'?`Before choices were revealed, every available option earned the same expected payoff: ${fmt(exp)} points. Actual earnings vary with the random choices and matching. Higher rewards alone do not make a new option better against these odds.`:result.total===0?`You departed from the bots’ shared convention. No bot followed your choice, so this deviation earned zero. A better option on its own cannot deliver coordination.`:`Matching the shared convention is a best response. Changing your choice alone would earn zero against these bots.`}</p>${phase===1&&phaseRows()===config.length?`<div class="transition"><h3>There’s a new possibility.</h3><p>Phase 2 adds E, F and G. Each can pay up to <strong>600</strong> points instead of 420. Old options remain available. A higher maximum helps only when other people select the same new option.</p></div>`:''}</section>`;}
function summary(){if(!done())return '';const totals=[1,2].map(p=>rows.filter(r=>r.phase===p).reduce((a,r)=>a+r.total,0)),coord=rows.filter(r=>r.phase===2&&r.partnerMatch&&r.matches===config.n-2&&maximum(r.choice)===600).length;return `<section class="summary" aria-label="Session complete"><p class="kicker">SESSION COMPLETE</p><h3>${coord===config.length?'A new convention, together.':config.mode==='stay'?'A stable convention can persist.':'Coordination is the missing ingredient.'}</h3><p>You earned <strong>${fmt(totals[0]+totals[1])}</strong> points: ${fmt(totals[0])} in Phase 1 and ${fmt(totals[1])} in Phase 2. Your whole community coordinated on a new option in ${coord} of the ${config.length} Phase 2 periods.</p><p>${config.mode==='switch'?'The bots switched at a pre-agreed date. This is one possible equilibrium path, not an explanation of how a real community reaches agreement.':config.mode==='stay'?'Everyone staying on the old option remains a Nash equilibrium, even when everyone switching would pay more. One person switching alone cannot overturn the convention.':'Independent equilibrium mixing makes every available choice equally attractive in expectation. It can still produce occasional coordination and unequal realized earnings.'}</p><p>Discuss: what might help people select the same new convention when nobody knows what everyone else will do?</p><button class="primary" id="compare">Try another bot equilibrium</button><button class="ghost" id="export">Download choices (CSV)</button></section>`;}
function play(){const count=phaseRows(),finished=done();return `<div class="layout"><section class="stage" aria-labelledby="phase-title"><div class="stage-head"><div><span class="phase-tag">PHASE ${phase} / ${phase===1?'ESTABLISH A CONVENTION':'A BETTER ALTERNATIVE'}</span><h2 id="phase-title">${phase===1?'Can you find common ground?':'Will everyone make the switch?'}</h2></div><span class="period">PERIOD ${Math.min(count+(result?0:1),config.length)} / ${config.length}</span></div><p class="lead">Choose the same symbol as others to earn points. ${phase===1?'Each option can pay up to 420.':'Old symbols pay up to 420; new ones pay up to 600.'}</p><div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="${2*config.length}" aria-valuenow="${rows.length}"><span style="width:${rows.length/(2*config.length)*100}%"></span></div>${rows.length===0?'<p class="notice">One choice per period. Make your selection, then reveal the result. The bot plan is shown in “Your experiment”; you can explore deviations without changing it.</p>':''}${phase===2&&count===0?'<p class="notice">E, F and G have arrived. Their higher rewards are not a bonus for choosing alone: they still require matching choices.</p>':''}${board()}<div class="choice-label"><span>${result?'YOUR CHOICE IS LOCKED FOR THIS PERIOD':'SELECT ONE SYMBOL'}</span><span>${phase===1?'4 old options':'4 old + 3 new options'}</span></div><div class="option-grid ${phase===2?'seven':''}" aria-label="Available symbols">${order.map(o=>`<button class="option ${maximum(o)===600?'fresh':''}" data-option="${o}" aria-label="Choose option ${o}, ${maximum(o)} points at full coordination" aria-pressed="${selected===o}" ${result?'disabled':''}>${maximum(o)===600?'<span class="new">NEW</span>':''}${icon(o)}<strong>${o}</strong><small>up to ${maximum(o)}</small></button>`).join('')}</div>${!finished?`<div class="action-row"><span class="quiet">${result?'Only your own matching feedback is shown, as in the paper.':selected?`Option ${selected} selected. Your choice stays private until the reveal.`:'No points are spent. A mismatch earns less, possibly zero.'}</span>${result?`<button class="primary" id="next">${phase===1&&count===config.length?'Start Phase 2 →':'Next period →'}</button>`:`<button class="primary" id="reveal" ${selected?'':'disabled'}>Reveal result ↗</button>`}</div>`:''}${feedback()}${summary()}</section>${controls()}</div><section class="lower" aria-label="Your period history"><h2>YOUR SIGNAL HISTORY</h2>${rows.length?`<div class="history">${rows.map((r,i)=>`<button data-history="${i}" class="${maximum(r.choice)===600?'fresh':''} ${r.total===0?'zero':''}" style="height:${Math.max(18,r.total/600*65)}px" aria-label="Period ${i+1}, phase ${r.phase}, option ${r.choice}, ${fmt(r.total)} points" title="Period ${i+1}: ${fmt(r.total)} points">${r.choice}</button>`).join('')}</div><p class="history-caption">Bar height = your points. Violet = old option; peach = new option. Select a bar to inspect.</p><p class="history-inspect" id="history-detail">${inspect>=0?historyText(inspect):''}</p>`:'<p class="empty">Your first decision will appear here.</p>'}</section>`;}
function historyText(i){const r=rows[i];return `Period ${i+1} · Phase ${r.phase} · ${r.choice} · partner ${r.partnerMatch?'matched':'different'} · ${r.matches}/${config.n-2} other matches · ${fmt(r.total)} points`;}
function calculator(){const t=tipping(calcN,calcCount);return `<div class="calc-grid"><section class="calc-panel"><p class="kicker">COUNTERFACTUAL LAB</p><h2>How many others need to switch?</h2><p>Imagine the other players split between <strong>one old option</strong> and <strong>one new option</strong>. Move the slider to compare your expected earnings before a random partner is drawn.</p><p>This calculator is separate from the game. The split you set need not be a Nash equilibrium, and the game bots do not adopt it.</p><label class="field calc-select"><span>Community size</span><select id="calc-size"><option value="8" ${calcN===8?'selected':''}>8 players</option><option value="16" ${calcN===16?'selected':''}>16 players</option></select></label><div class="counter"><strong id="calc-number">${calcCount}</strong><span>of ${calcN-1} other players choose the new option</span></div><label class="sr-only" for="switchers">Other players choosing the same new option</label><input id="switchers" type="range" min="0" max="${calcN-1}" step="1" value="${calcCount}" aria-valuetext="${calcCount} of ${calcN-1} others switch"><div class="range-ends"><span>NONE SWITCH</span><span>ALL OTHERS SWITCH</span></div><div class="calc-pop" id="calc-pop" aria-hidden="true">${calcPeople()}</div><p class="quiet">All switchers must choose the same new symbol. Splitting across E, F and G weakens coordination.</p></section><section class="calc-panel" aria-label="Expected payoff comparison"><p class="kicker">YOUR BEST RESPONSE</p><h2>Stay or switch?</h2><div id="calc-result">${calcResult(t)}</div><p class="math">Expected points = maximum reward × (others choosing your symbol) / (community size − 1)</p><p>Pair-heavy and group-heavy treatments have the <strong>same expected payoff</strong> before random matching. They differ in how strongly your realized earnings depend on your partner.</p><p class="quiet">The first profitable switching count is ${t.threshold} other players. Including you, that makes ${calcN/2} adopters: half the community. This is a two-option best-response comparison, not a universal tipping threshold.</p></section></div>`;}
function calcPeople(){return Array.from({length:calcN-1},(_,i)=>`<span class="calc-person ${i<calcCount?'new':''}"></span>`).join('');}
function calcResult(t){return `<div class="pay-row"><span>Old option</span><div class="paybar"><span style="width:${t.oldPay/600*100}%"></span></div><strong>${fmt(t.oldPay)}</strong></div><div class="pay-row new"><span>New option</span><div class="paybar"><span style="width:${t.newPay/600*100}%"></span></div><strong>${fmt(t.newPay)}</strong></div><p class="calc-verdict" role="status">${t.best==='new'?`Switching earns ${fmt(t.newPay-t.oldPay)} more expected points.`:t.best==='old'?`Staying earns ${fmt(t.oldPay-t.newPay)} more expected points.`:'Both choices earn the same expected points.'}</p>`;}
function guide(){const d=$('#guide');d.innerHTML=`<div class="guide-head"><h2>Small choices. Shared conventions.</h2><button class="modal-close" id="close-guide">Close</button></div><div class="guide-body"><h3>1. The decision</h3><p>You play in a fixed community of 8 or 16 players. Every period you choose one abstract symbol. You are randomly paired with one of the other players; the remaining 6 or 14 people count as “other members”. Choices are simultaneous and hidden until you reveal the result.</p><p>Phase 1 has four symbols, A–D. Phase 2 adds E–G. Old symbols can earn up to 420 points per period; new ones can earn up to 600. There is no fixed switching fee: the cost of trying a new symbol is the earnings you forgo when others fail to match it.</p><h3>2. Where points come from</h3><table><thead><tr><th>Treatment</th><th>Your partner</th><th>Other members</th></tr></thead><tbody><tr><td>Group-heavy (G)</td><td>10%</td><td>90%</td></tr><tr><td>Pair-heavy (P)</td><td>90%</td><td>10%</td></tr></tbody></table><p class="math">Points = symbol’s maximum × [partner weight × partner match + group weight × (matching other members / total other members)]</p><p>A partner match is 1 when you choose the same symbol, and 0 otherwise. Example: in G8, choosing an old symbol, matching your partner and 2 of the 6 other members earns 420 × (0.1 + 0.9 × 2/6) = <strong>168</strong> points. Full coordination earns 420 or 600. Choosing a symbol nobody else selects earns zero.</p><h3>3. What do “Nash bots” mean?</h3><p>A Nash equilibrium is a set of strategies where no player can raise their expected payoff by changing only their own strategy. There is more than one equilibrium here. The app lets you compare three selected profiles:</p><ul><li><strong>Keep the old convention:</strong> everyone is prescribed the same old symbol throughout. A lone switch earns zero, so the old convention remains a pure Nash equilibrium in Phase 2.</li><li><strong>Coordinate a switch:</strong> everyone is prescribed one old symbol in Phase 1 and the same new symbol from the first period of Phase 2. Both stages are pure Nash equilibria. The date and symbol are pre-agreed; this does not generate an endogenous tipping process.</li><li><strong>Randomize in equilibrium:</strong> each bot independently chooses each old symbol with probability 1/4 in Phase 1. In Phase 2 each old symbol has probability 10/61 and each new symbol 7/61. Every available action then earns the same expected payoff: 105 in Phase 1 and 4200/61 ≈ 68.85 in Phase 2. This is a symmetric mixed Nash equilibrium.</li></ul><p>In the pure modes, a matching human completes the equilibrium profile. If you deviate, the bots keep their assigned strategies; the realized play need not be an equilibrium. The randomized mode refers to strategies, not to each realized set of choices. These bots do not learn, imitate, punish or estimate the behavior of experimental participants.</p><h3>4. The tipping calculator</h3><p>Before random matching, your expected earnings from an option are its maximum reward multiplied by the fraction of the other players choosing it. This expectation is identical in G and P treatments because each other player is equally likely to become your partner. In the calculator’s two-option split, switching to the new option first becomes profitable with 3 other adopters in an 8-person group, or 7 in a 16-person group. Including you, that is half the group. This threshold depends on the stated split and rewards; it is not a general law of social change.</p><h3>5. Research and teaching adaptations</h3><p>Based on <cite>Social Tipping Points: An Experiment</cite> by Boris Wieczorek, Veronica Pizziol and Alessandro Tavoni, the working-paper PDF supplied by the author on 16 November 2026. Rules follow Section 3, equation (1), and the supplementary instructions; equilibrium discussion is in Section 4 and S1–S2.</p><p>The app uses the explicit 420/600 rewards from equation (1). The supplement’s 1.42859 multiplier produces tiny rounding differences; here the higher maximum is exactly 600. All four treatments G8, P8, G16 and P16 are available.</p><p>The original study has 21 periods in each phase; this app defaults to a shorter 5 + 5 classroom session and offers the full 21 + 21. The study’s unannounced second phase, abstract unlabeled artwork, randomized per-person layouts, belief elicitation and additional questionnaires are replaced or omitted. This app announces both phases, uses original labeled line-art symbols and one shuffled layout per phase, discloses bot strategies, adds a history chart and a separate counterfactual calculator. Feedback in the game reveals only whether your partner and how many other members matched your choice. The symbols carry no real-world or moral meaning.</p><p>Scores are fictional and sum all periods for teaching. Choices remain in this page’s memory; refreshing resets them. CSV downloads are created locally. There are no accounts, analytics or external game services; ordinary hosting access logs may exist.</p><h3>6. Talk about it</h3><ul><li>Why can a better option fail to displace an old convention?</li><li>How is a pre-agreed switch different from an emergent transition?</li><li>Why can pair-heavy payoffs feel riskier even when expected earnings are unchanged?</li><li>Which information or communication might help a real community choose the same new option?</li></ul></div>`;d.showModal();$('#close-guide').onclick=()=>d.close();}
function render(){
 $('#app').innerHTML=`<header><div class="wrap"><a class="brand" href="games.html"><span class="brand-mark" aria-hidden="true">⌁</span> SWITCHBOARD</a><div class="header-actions"><a class="collection" href="games.html">All games ↗</a><button class="ghost" id="open-guide">Rules & research</button></div></div></header><main class="wrap" id="main"><div class="intro"><div><p class="kicker">THE SOCIAL TIPPING GAME</p><h1>A new option.<br><span>A shared decision.</span></h1></div><p class="intro-copy">Better choices need people to move together. Explore how conventions hold, and what changes when everyone coordinates a switch.</p></div><div class="tabs" role="tablist" aria-label="Switchboard views"><button class="tab" id="play-tab" role="tab" aria-selected="${view==='play'}" aria-controls="workspace" tabindex="${view==='play'?0:-1}">01 / Play the game</button><button class="tab" id="calc-tab" role="tab" aria-selected="${view==='calc'}" aria-controls="workspace" tabindex="${view==='calc'?0:-1}">02 / Tipping calculator</button></div><div id="workspace" role="tabpanel" aria-labelledby="${view==='play'?'play-tab':'calc-tab'}">${view==='play'?play():calculator()}</div><p id="live" role="status" aria-live="polite"></p></main><footer><div class="wrap"><p>Based on <em>Social Tipping Points: An Experiment</em> · Wieczorek, Pizziol & Tavoni.<br>Classroom adaptation · Nash strategies are benchmarks, not predictions of people.</p><a href="https://github.com/aletavoni/common-ground">Source collection ↗</a></div></footer>`;
 $('#open-guide').onclick=guide;
 for(const [id,v] of [['play-tab','play'],['calc-tab','calc']]){const el=$('#'+id);el.onclick=()=>{view=v;render();$('#'+id).focus();};el.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();view=e.key==='ArrowLeft'||e.key==='Home'?'play':'calc';render();$('#'+(view==='play'?'play-tab':'calc-tab')).focus();}};}
 if(view==='calc'){$('#calc-size').onchange=e=>{calcN=Number(e.target.value);calcCount=Math.min(calcCount,calcN-1);render();$('#calc-size').focus();};$('#switchers').oninput=e=>{calcCount=Number(e.target.value);e.target.setAttribute('aria-valuetext',`${calcCount} of ${calcN-1} others switch`);$('#calc-number').textContent=calcCount;$('#calc-pop').innerHTML=calcPeople();$('#calc-result').innerHTML=calcResult(tipping(calcN,calcCount));};return;}
 document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{selected=b.dataset.option;render();$(`[data-option="${selected}"]`).focus();});
 if($('#reveal'))$('#reveal').onclick=()=>{result=round(config,phase,selected);rows.push(result);render();$('#live').textContent=`Period result: ${fmt(result.total)} points. Your partner ${result.partnerMatch?'matched':'did not match'}; ${result.matches} other members matched.`;($('#next')||$('#compare')).focus();};
 if($('#next'))$('#next').onclick=()=>{if(phase===1&&phaseRows()===config.length){phase=2;order=shuffled([...order,...OPTIONS.slice(4)]);}selected=null;result=null;render();$('#phase-title').setAttribute('tabindex','-1');$('#phase-title').focus();};
 ['size','weight','mode','length'].forEach(id=>$('#'+id).onchange=()=>{$('#restart').textContent='Apply settings & restart';$('#settings-note').hidden=false;});
 $('#restart').onclick=()=>{config=validateConfig({...config,n:Number($('#size').value),weight:$('#weight').value,mode:$('#mode').value,length:Number($('#length').value),old:choose({A:.25,B:.25,C:.25,D:.25}),fresh:choose({E:1/3,F:1/3,G:1/3})});reset();};
 document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{inspect=Number(b.dataset.history);$('#history-detail').textContent=historyText(inspect);});
 if($('#compare'))$('#compare').onclick=()=>{config.mode=MODES[(MODES.indexOf(config.mode)+1)%MODES.length];reset();};
 if($('#export'))$('#export').onclick=()=>{const blob=new Blob([csv(rows,config)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='switchboard-choices.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
}
function reset(){phase=1;rows=[];selected=null;result=null;inspect=-1;order=shuffled(OPTIONS.slice(0,4));render();$('#live').textContent='New session started. Select a symbol.';}
render();
</script></body></html>
