</style></head><body><div id="app"></div><dialog id="guide" aria-label="Rules and research"></dialog><noscript>Enable JavaScript to play this game.</noscript><script type="module">const SUM=a=>a.reduce((x,y)=>x+y,0);
const NET_NAMES={complete:'Complete network',circle:'Undirected circle',directed:'Directed circle'};
function neighbors(i,type){return [0,1,2,3].filter(j=>j!==i&&(type==='complete'||j===(i+1)%4||(type==='circle'&&j===(i+3)%4)));}
function extractionPayoffs(xs){const X=SUM(xs);return xs.map(x=>125+20*x-.25*x*X);}
function networkRound(x,type,punishments=[0,0,0,0],seat=0){
 if(!Number.isInteger(x)||x<0||x>25||!Object.keys(NET_NAMES).includes(type))throw Error('Invalid network choice');
 const xs=Array(4).fill(16);xs[seat]=x;const first=extractionPayoffs(xs),allowed=neighbors(seat,type),spent=SUM(punishments);
 if(punishments.length!==4||punishments.some((p,j)=>!Number.isInteger(p)||p<0||(p>0&&!allowed.includes(j)))||spent>Math.floor(first[seat]))throw Error('Invalid punishment budget or target');
 const final=first.map((v,j)=>Math.max(0,v-(j===seat?spent:3*punishments[j])));
 return {xs,first,final,spent,allowed,total:final[seat]};
}
const CATALYST_CASES=[
 {id:'T0',title:'No coalition',coalition:false,innovation:0,spill:false},
 {id:'T1',title:'Coalition only',coalition:true,innovation:0,spill:false},
 {id:'T2',title:'Low innovation · members only',coalition:true,innovation:.02,spill:false},
 {id:'T3',title:'Low innovation · spillovers',coalition:true,innovation:.02,spill:true},
 {id:'T4',title:'High innovation · members only',coalition:true,innovation:.07,spill:false},
 {id:'T5',title:'High innovation · spillovers',coalition:true,innovation:.07,spill:true}
];
function prescribedMembers(t){return t.id==='T0'?[]:t.id==='T4'?[0,1,2,3,4,5,6]:[0,1];}
const memberA=s=>2*s+1;
function coalitionActions(t,members){const s=members.length;if(s<2)return Array(7).fill(50);return Array.from({length:7},(_,i)=>members.includes(i)?memberA(s):(105-s*memberA(s))/(7-s));}
function coalitionPayoffs(t,members,actions){const s=members.length,formed=t.coalition&&s>=2,X=SUM(actions),gross=actions.map((a,i)=>{const b=6*(1+(formed&&(members.includes(i)||t.spill)?s*t.innovation:0));return 10*a+b*(50-a)-X;});return {X,gross,expected:gross.map(v=>v*(X>105+1e-8?.5:1)),crossed:X>105+1e-8};}
function catalystRound(t,join,action,seat=6,baseline='safe',coin=.9){
 if(!CATALYST_CASES.includes(t))throw Error('Invalid treatment');
 let members=prescribedMembers(t).filter(i=>i!==seat);if(t.coalition&&join)members.push(seat);if(!t.coalition)members=[];
 const formed=members.length>=2,actions=t.coalition?coalitionActions(t,members):Array(7).fill(baseline==='safe'?15:50);
 const bound=formed&&members.includes(seat);
 if(!bound){if(!Number.isInteger(action)||action<0||action>50)throw Error('Invalid investment');actions[seat]=action;}
 const r=coalitionPayoffs(t,members,actions),lost=r.crossed&&coin<.5;
 return {...r,members,formed,bound,actions,lost,realized:r.gross.map(v=>lost?0:v),total:lost?0:r.gross[seat],seat};
}
const QUORUM_CASES=[{title:'Known target · 75% loss risk',p:.75,uncertain:false},{title:'Known target · 55% loss risk',p:.55,uncertain:false},{title:'Known target · 95% loss risk',p:.95,uncertain:false},{title:'Two targets · 95% loss risk',p:.95,uncertain:true},{title:'Two targets · 55% loss risk',p:.55,uncertain:true},{title:'Two targets · 75% loss risk',p:.75,uncertain:true}];
function quorumSurvival(c,total){return c.uncertain?(total>=290?1:total>=190?1-.45*c.p:1-.9*c.p):(total>=240?1:1-.9*c.p);}
function quorumExpected(c,xs){const s=quorumSurvival(c,SUM(xs));return xs.map(x=>(120-x)*s);}
const balanced=(total,n)=>Array.from({length:n},(_,i)=>Math.floor(total/n)+(i<total%n?1:0));
function isQuorumNash(c,xs){const pay=quorumExpected(c,xs);return xs.every((_,i)=>Array.from({length:121},(_,d)=>{const a=[...xs];a[i]=d;return quorumExpected(c,a)[i]<=pay[i]+1e-9;}).every(Boolean));}
function quorumProfile(c,mode='provision'){
 if(mode==='zero')return [0,0,0,0];
 const candidates=[0,...(c.uncertain?[190,290]:[240])].map(t=>balanced(t,4)).filter(xs=>isQuorumNash(c,xs));
 return candidates.sort((a,b)=>SUM(quorumExpected(c,b))-SUM(quorumExpected(c,a)))[0];
}
function quorumRound(c,x,mode='provision',seat=0,random=Math.random){
 if(!Number.isInteger(x)||x<0||x>120)throw Error('Invalid contribution');
 const xs=quorumProfile(c,mode);xs[seat]=x;const threshold=c.uncertain?(random()<.5?190:290):240,success=SUM(xs)>=threshold,loss=!success&&random()<c.p;
 return {xs,threshold,success,loss,expected:quorumExpected(c,xs),realized:xs.map(x=>(120-x)*(loss?.1:1)),total:(120-x)*(loss?.1:1)};
}
const FOGLINE_PROFILES={certainty:{provision:[20,20,20,20,20,20],zero:[0,0,0,0,0,0]},risk:{zero:[0,0,0,0,0,0],small:[4,4,4,4,2,2],medium:[8,8,6,6,6,6]},ambiguity:{robust:[0,0,0,0,0,0]}};
function fogCDF(type,total,bag){if(type==='certainty')return total>=120?1:0;if(type==='risk')return Math.min(13,Math.floor(total/20)+1)/13;if(!bag)throw Error('No probability supplied for ambiguity');return SUM(bag.filter(t=>t<=total).map(()=>1))/bag.length;}
function fogExpected(type,own,others,bag){return (40-own)*(.1+.9*fogCDF(type,own+others,bag));}
function fogPlan(total){if(total<0||total>40||total%2)throw Error('Invalid planned contribution');const a=[];for(let i=0;i<10;i++){const x=Math.min(4,total);a.push(x);total-=x;}return a;}
function fogSchedule(type,mode){return FOGLINE_PROFILES[type][mode].map(c=>type==='certainty'&&mode==='provision'?Array(10).fill(2):fogPlan(c));}
function hiddenBag(random=Math.random){const bag=[],counts=Array(13).fill(0);while(bag.length<52){const i=Math.min(12,Math.floor(random()*13));if(counts[i]<50){bag.push(i*20);counts[i]++;}else {const j=counts.findIndex(c=>c<50);bag.push(j*20);counts[j]++;}}return bag;}
function fogFinish(type,contributions,random=Math.random,bag){const totals=contributions.map(SUM),group=SUM(totals),threshold=type==='certainty'?120:type==='risk'?Math.floor(random()*13)*20:bag[Math.min(bag.length-1,Math.floor(random()*bag.length))],success=group>=threshold;return {totals,group,threshold,success,earnings:totals.map(c=>(40-c)*(success?1:.1))};}

function frame(name,tag,title,copy,content){$('#app').innerHTML=`<a class="skip" href="#main">Skip to game</a><header><div class="wrap"><a class="brand" href="games.html">${name}</a><nav><a href="games.html">All games ↗</a><button class="quiet-button" id="rules">Rules & research</button></nav></div></header><main class="wrap" id="main"><div class="intro"><div><p class="eyebrow">${tag}</p><h1>${title}</h1></div><p class="intro-copy">${copy}</p></div>${content}<p class="live" id="live" role="status" aria-live="polite"></p></main><footer><div class="wrap"><span>Classroom adaptation · Fictional points · Bots follow the disclosed benchmark.</span><a href="https://github.com/aletavoni/common-ground">View collection source ↗</a></div></footer>`;$('#rules').onclick=()=>openGuide(name,gameGuide);}
function openGuide(name,html){const d=$('#guide');d.innerHTML=`<div class="guide-head"><h2>${name}: rules & research</h2><button id="close-guide" class="quiet-button">Close</button></div><div class="guide-body">${html}<h3>Teaching adaptation and data</h3><p>This app uses fictional cumulative points, immediate feedback and the stated bots. It does not reproduce the experiment’s participants, matching pool, practice tasks or monetary payment. Human deviations need not produce equilibrium play. There are no accounts or analytics. Choices stay in this page’s memory and reset on refresh; downloads are created locally. Ordinary hosting access logs may exist.</p></div>`;d.showModal();$('#close-guide').onclick=()=>d.close();}
function exportCSV(name,rows){const keys=Object.keys(rows[0]||{}),escape=x=>'"'+String(x??'').replaceAll('"','""')+'"',text=[keys.map(escape).join(','),...rows.map(r=>keys.map(k=>escape(r[k])).join(','))].join('\r\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const stat=(label,value)=>`<div class="stat"><span>${label}</span><strong>${value}</strong></div>`;
const field=(label,id,options,value)=>`<label class="field"><span>${label}</span><select id="${id}">${options.map(([v,l])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${l}</option>`).join('')}</select></label>`;
const number=(label,id,value,min,max,step=1)=>`<label class="field"><span>${label}</span><input type="number" id="${id}" value="${value}" min="${min}" max="${max}" step="${step}" inputmode="numeric"></label>`;
const humanNote='<p class="fine">A Nash equilibrium is a set of strategies where nobody gains in expected earnings by changing only their own strategy. Bots are mathematical benchmarks, not estimates of human behavior.</p>';

{
let treatment=1,baseline='safe',step='membership',join=false,a=19,r=null,sessionScore=0;
gameGuide=`<h3>Seven countries, two projects</h3><p>Each player invests 50 points between Project A and Project B. A returns 10 per unit but imposes a cost of 1 on <em>each</em> of the seven players per unit invested. B starts at a return of 6 with no external cost. Each person’s pre-disaster earnings equal 10A + return-to-B × (50−A) − total group A. If total A exceeds 105, a common coin toss gives a 50% chance that everyone loses all these earnings. Otherwise they keep them.</p><h3>Membership is binding</h3><p>A coalition needs at least two signatories. With s=2,3,4,5,6,7 members, each member is required to invest respectively 5,7,9,11,13,15 in A. Non-members can choose any whole amount from 0 to 50. The safe symmetric A choices for non-members are respectively 19,21,23,25,27; with all seven members, the threshold is met automatically.</p><h3>Innovation and spillovers</h3><p>T0 has no membership stage. T1 adds only a coalition. T2/T3 increase B’s return by 2% per coalition member; T4/T5 use 7%. In T2/T4 only members receive this innovation benefit; in T3/T5 the benefit spills to everybody. The return is 6×(1+sI), provided a coalition forms. There is no innovation bonus if membership fails.</p><h3>Selected equilibrium</h3><p>In T1, T2, T3 and T5, bots 1 and 2 join and the rest stay outside; you occupy seat 7 and are prescribed to stay outside. In T4, all six bots join and you are prescribed to join. After any membership choice, non-members play the symmetric safe continuation when a coalition forms; with fewer than two signatories all players select the no-coalition gamble equilibrium, investing 50 in A. A lone non-member facing six signatories selects 27. These history-contingent continuations and membership profiles have been checked against all unilateral membership and integer investment deviations.</p><p>The no-coalition gamble fallback is the equilibrium-selection assumption used by the paper’s Appendix 2 to sustain a two-member coalition. It is essential: it is not a prediction that human players necessarily behave this way. For T0 you can separately compare the safe equilibrium (15 in A each) with the gamble equilibrium (50 each). Human deviations can leave the equilibrium profile.</p><h3>Research</h3><p>Bosetti, Heugues and Tavoni (2017), <cite>Luring others into climate action: coalition formation games with threshold and spillover effects</cite>, Oxford Economic Papers 69(2), 410–431. Based on the supplied manuscript’s Section 3, Tables 2–3 and Appendices 1–2. All six treatments are available. The app presents independently replayable negotiations instead of the laboratory session and shows expected earnings alongside the realized common lottery. Monetary conversion and experimental questionnaires are omitted.</p>${humanNote}`;
function projected(){const t=CATALYST_CASES[treatment];let m=prescribedMembers(t).filter(i=>i!==6);if(t.coalition&&join)m.push(6);return m;}
function memberBoard(m){return `<div class="membership"><section><h3>THE COALITION · ${m.length}</h3><div class="chips">${m.map(i=>`<span class="chip member ${i===6?'you':''}">${i===6?'YOU':i+1}</span>`).join('')||'<span class="fine">No signatories</span>'}</div></section><section><h3>THE FRINGE · ${7-m.length}</h3><div class="chips">${[0,1,2,3,4,5,6].filter(i=>!m.includes(i)).map(i=>`<span class="chip ${i===6?'you':''}">${i===6?'YOU':i+1}</span>`).join('')||'<span class="fine">Everyone joined</span>'}</div></section></div>`;}
function render(){const t=CATALYST_CASES[treatment],m=r?r.members:projected(),formed=m.length>=2,bound=formed&&m.includes(6),safe=formed?(105-m.length*memberA(m.length))/(7-m.length):15,rate=6*(1+(formed&&(bound||t.spill)?m.length*t.innovation:0));frame('CATALYST','COALITIONS / TECHNOLOGY / SPILLOVERS','Who moves first?<br>Who follows?','Join a climate coalition or keep your freedom. Can innovation benefits persuade the fringe to do its share?',`<div class="layout"><section class="panel catalyst-stage"><p class="eyebrow">${t.id} / ${t.title}</p><div class="flow"><span class="${step==='membership'?'active':''}">01 MEMBERSHIP</span><span class="${step==='investment'?'active':''}">02 INVESTMENT</span><span class="${step==='result'?'active':''}">03 OUTCOME</span></div><h2>${step==='membership'?'Make your commitment.':step==='investment'?'The coalition has committed.':r.crossed?'The group crossed the limit.':'The group stayed within the limit.'}</h2>${memberBoard(m)}${step==='membership'?`<p class="fine">${t.coalition?`${prescribedMembers(t).filter(i=>i!==6).length} of the 6 bots will sign. A coalition forms only with at least 2 members. If you join, your investment becomes binding.`:'In the baseline there is no membership decision. Everyone chooses investments simultaneously.'}</p>${t.coalition?`<div class="choice-buttons"><button id="stay" aria-pressed="${!join}">Stay outside</button><button id="join" aria-pressed="${join}">Join the coalition</button></div>`:''}<div class="note">${t.id==='T4'?'The selected equilibrium prescribes joining the grand coalition.':t.coalition?'The selected equilibrium prescribes staying outside a two-member coalition.':`The ${baseline} baseline prescribes ${baseline==='safe'?15:50} in Project A.`} You can explore a different choice.</div><button class="primary" id="membership">${t.coalition?'Confirm membership →':'Choose investments →'}</button>`:step==='investment'?`<p class="fine">${bound?`Your signature fixes your investment at ${memberA(m.length)} in A. The rest goes to B.`:formed?`Coalition members invest ${memberA(m.length)} each in A. If all fringe players invest ${fmt(safe)} each, the group reaches exactly 105.`:'No coalition formed. The bots’ fallback is to invest 50 each in A.'}</p>${!bound?`<label class="field"><span>Your investment in Project A</span><output class="counter" id="a-value">${a}</output><input type="range" id="investment" min="0" max="50" step="1" value="${a}" aria-label="Investment in project A"></label>`:''}<div class="split-projects"><div class="project"><span class="fine">PROJECT A · PRIVATE RETURN 10</span><strong id="project-a">${bound?memberA(m.length):a}</strong><span class="fine">Group cost: 1 each per unit</span></div><div class="project b"><span class="fine">PROJECT B · YOUR RETURN ${fmt(rate)}</span><strong id="project-b">${50-(bound?memberA(m.length):a)}</strong><span class="fine">No external damage</span></div></div><button class="primary" id="resolve">Resolve the negotiation →</button>`:`<div class="limit" aria-label="Total A investment ${fmt(r.X)} out of 350, safe limit 105"><span style="width:${r.X/350*100}%"></span></div><div class="limit-label"><span>0</span><span>SAFE LIMIT 105 · LINE AT 30%</span><span>350</span></div><div class="receipt"><h3>${r.lost?'The common loss occurred.':'You keep your earnings.'}</h3><div class="number-stamp">${fmt(r.total)}</div><p class="fine">Your pre-disaster earnings: ${fmt(r.gross[6])}. Expected earnings before the common coin toss: ${fmt(r.expected[6])}.</p><p>${r.crossed?`The group invested ${fmt(r.X)} in A. Crossing 105 exposed everyone to the same 50% chance of losing everything. The common draw ${r.lost?'triggered the loss':'spared the group'}.`:`The group invested ${fmt(r.X)} in A, so no disaster lottery was needed.`}</p></div><table class="ledger"><thead><tr><th>Player</th><th>Status</th><th>A</th><th>B</th><th>Expected</th></tr></thead><tbody>${r.actions.map((v,i)=>`<tr class="${i===6?'you':''}"><td>${i===6?'You':i+1}</td><td>${r.formed&&m.includes(i)?'Member':'Fringe'}</td><td>${v}</td><td>${50-v}</td><td>${fmt(r.expected[i])}</td></tr>`).join('')}</tbody></table><button class="primary" id="again">Another negotiation</button><button class="quiet-button" id="export">Download choices (CSV)</button>`}</section><aside class="panel side"><h2>Innovation settings</h2>${field('Treatment','treatment',CATALYST_CASES.map((x,i)=>[i,x.id+' · '+x.title]),treatment)}${field('T0 equilibrium','baseline',[['safe','Safe · 15 in A each'],['gamble','Gamble · 50 in A each']],baseline)}<button class="quiet-button" id="apply">Apply & restart</button><div class="note"><strong>Bot plan</strong><br>${t.id==='T0'?`All six bots choose ${baseline==='safe'?15:50} in A.`:`Bots form ${t.id==='T4'?'a grand':'a two-member'} coalition when you follow the prescribed membership. They coordinate on safe investment if a coalition forms; otherwise they gamble.`}</div><div class="stats">${stat('INNOVATION',Math.round(t.innovation*100)+'%')}${stat('SPILLOVERS',t.spill?'Yes':'No')}${stat('GROUP SIZE','7')}</div><p class="fine">Members’ signature is binding. Fringe investments are free choices. Everyone faces the same catastrophe draw.</p><p class="fine">Your cumulative points: <strong>${fmt(sessionScore)}</strong>.</p></aside></div>`);$('#apply').onclick=()=>{treatment=Number($('#treatment').value);baseline=$('#baseline').value;reset();};if(step==='membership'){if(t.coalition){$('#stay').onclick=()=>{join=false;render();};$('#join').onclick=()=>{join=true;render();};}$('#membership').onclick=()=>{step='investment';const mm=projected();a=mm.length>=2?Math.round((105-mm.length*memberA(mm.length))/(7-mm.length)):baseline==='safe'&&!t.coalition?15:50;if(mm.includes(6)&&mm.length>=2)a=memberA(mm.length);render();};}if(step==='investment'){if($('#investment'))$('#investment').oninput=e=>{a=Number(e.target.value);$('#a-value').textContent=a;$('#project-a').textContent=a;$('#project-b').textContent=50-a;};$('#resolve').onclick=()=>{r=catalystRound(t,join,a,6,baseline,Math.random());sessionScore+=r.total;dataRows.push({case:t.id,joined:join,coalition:r.members.length,investment_a:r.actions[6],group_a:r.X,expected:r.expected[6],realized:r.total,loss:r.lost});step='result';render();$('#live').textContent=`Negotiation resolved. Your earnings: ${fmt(r.total)}.`;};}if(step==='result'){$('#again').onclick=reset;$('#export').onclick=()=>exportCSV('catalyst',dataRows);}}
function reset(){step='membership';r=null;join=treatment===4;render();}
reset();

}</script></body></html>
