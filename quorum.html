</style></head><body><div id="app"></div><dialog id="guide" aria-label="Rules and research"></dialog><noscript>Enable JavaScript to play this game.</noscript><script type="module">const SUM=a=>a.reduce((x,y)=>x+y,0);
const NET_NAMES={complete:'Complete network',circle:'Undirected circle',directed:'Directed circle'};
function neighbors(i,type){return [0,1,2,3].filter(j=>j!==i&&(type==='complete'||j===(i+1)%4||(type==='circle'&&j===(i+3)%4)));}
function extractionPayoffs(xs){const X=SUM(xs);return xs.map(x=>125+20*x-.25*x*X);}
function networkRound(x,type,punishments=[0,0,0,0],seat=0){
 if(!Number.isInteger(x)||x<0||x>25||!Object.keys(NET_NAMES).includes(type))throw Error('Invalid network choice');
 const xs=Array(4).fill(16);xs[seat]=x;const first=extractionPayoffs(xs),allowed=neighbors(seat,type),spent=SUM(punishments);
 if(punishments.length!==4||punishments.some((p,j)=>!Number.isInteger(p)||p<0||(p>0&&!allowed.includes(j)))||spent>Math.floor(first[seat]))throw Error('Invalid punishment budget or target');
 const final=first.map((v,j)=>Math.max(0,v-(j===seat?spent:3*punishments[j])));
 return {xs,first,final,spent,allowed,total:final[seat]};
}
const CATALYST_CASES=[
 {id:'T0',title:'No coalition',coalition:false,innovation:0,spill:false},
 {id:'T1',title:'Coalition only',coalition:true,innovation:0,spill:false},
 {id:'T2',title:'Low innovation · members only',coalition:true,innovation:.02,spill:false},
 {id:'T3',title:'Low innovation · spillovers',coalition:true,innovation:.02,spill:true},
 {id:'T4',title:'High innovation · members only',coalition:true,innovation:.07,spill:false},
 {id:'T5',title:'High innovation · spillovers',coalition:true,innovation:.07,spill:true}
];
function prescribedMembers(t){return t.id==='T0'?[]:t.id==='T4'?[0,1,2,3,4,5,6]:[0,1];}
const memberA=s=>2*s+1;
function coalitionActions(t,members){const s=members.length;if(s<2)return Array(7).fill(50);return Array.from({length:7},(_,i)=>members.includes(i)?memberA(s):(105-s*memberA(s))/(7-s));}
function coalitionPayoffs(t,members,actions){const s=members.length,formed=t.coalition&&s>=2,X=SUM(actions),gross=actions.map((a,i)=>{const b=6*(1+(formed&&(members.includes(i)||t.spill)?s*t.innovation:0));return 10*a+b*(50-a)-X;});return {X,gross,expected:gross.map(v=>v*(X>105+1e-8?.5:1)),crossed:X>105+1e-8};}
function catalystRound(t,join,action,seat=6,baseline='safe',coin=.9){
 if(!CATALYST_CASES.includes(t))throw Error('Invalid treatment');
 let members=prescribedMembers(t).filter(i=>i!==seat);if(t.coalition&&join)members.push(seat);if(!t.coalition)members=[];
 const formed=members.length>=2,actions=t.coalition?coalitionActions(t,members):Array(7).fill(baseline==='safe'?15:50);
 const bound=formed&&members.includes(seat);
 if(!bound){if(!Number.isInteger(action)||action<0||action>50)throw Error('Invalid investment');actions[seat]=action;}
 const r=coalitionPayoffs(t,members,actions),lost=r.crossed&&coin<.5;
 return {...r,members,formed,bound,actions,lost,realized:r.gross.map(v=>lost?0:v),total:lost?0:r.gross[seat],seat};
}
const QUORUM_CASES=[{title:'Known target · 75% loss risk',p:.75,uncertain:false},{title:'Known target · 55% loss risk',p:.55,uncertain:false},{title:'Known target · 95% loss risk',p:.95,uncertain:false},{title:'Two targets · 95% loss risk',p:.95,uncertain:true},{title:'Two targets · 55% loss risk',p:.55,uncertain:true},{title:'Two targets · 75% loss risk',p:.75,uncertain:true}];
function quorumSurvival(c,total){return c.uncertain?(total>=290?1:total>=190?1-.45*c.p:1-.9*c.p):(total>=240?1:1-.9*c.p);}
function quorumExpected(c,xs){const s=quorumSurvival(c,SUM(xs));return xs.map(x=>(120-x)*s);}
const balanced=(total,n)=>Array.from({length:n},(_,i)=>Math.floor(total/n)+(i<total%n?1:0));
function isQuorumNash(c,xs){const pay=quorumExpected(c,xs);return xs.every((_,i)=>Array.from({length:121},(_,d)=>{const a=[...xs];a[i]=d;return quorumExpected(c,a)[i]<=pay[i]+1e-9;}).every(Boolean));}
function quorumProfile(c,mode='provision'){
 if(mode==='zero')return [0,0,0,0];
 const candidates=[0,...(c.uncertain?[190,290]:[240])].map(t=>balanced(t,4)).filter(xs=>isQuorumNash(c,xs));
 return candidates.sort((a,b)=>SUM(quorumExpected(c,b))-SUM(quorumExpected(c,a)))[0];
}
function quorumRound(c,x,mode='provision',seat=0,random=Math.random){
 if(!Number.isInteger(x)||x<0||x>120)throw Error('Invalid contribution');
 const xs=quorumProfile(c,mode);xs[seat]=x;const threshold=c.uncertain?(random()<.5?190:290):240,success=SUM(xs)>=threshold,loss=!success&&random()<c.p;
 return {xs,threshold,success,loss,expected:quorumExpected(c,xs),realized:xs.map(x=>(120-x)*(loss?.1:1)),total:(120-x)*(loss?.1:1)};
}
const FOGLINE_PROFILES={certainty:{provision:[20,20,20,20,20,20],zero:[0,0,0,0,0,0]},risk:{zero:[0,0,0,0,0,0],small:[4,4,4,4,2,2],medium:[8,8,6,6,6,6]},ambiguity:{robust:[0,0,0,0,0,0]}};
function fogCDF(type,total,bag){if(type==='certainty')return total>=120?1:0;if(type==='risk')return Math.min(13,Math.floor(total/20)+1)/13;if(!bag)throw Error('No probability supplied for ambiguity');return SUM(bag.filter(t=>t<=total).map(()=>1))/bag.length;}
function fogExpected(type,own,others,bag){return (40-own)*(.1+.9*fogCDF(type,own+others,bag));}
function fogPlan(total){if(total<0||total>40||total%2)throw Error('Invalid planned contribution');const a=[];for(let i=0;i<10;i++){const x=Math.min(4,total);a.push(x);total-=x;}return a;}
function fogSchedule(type,mode){return FOGLINE_PROFILES[type][mode].map(c=>type==='certainty'&&mode==='provision'?Array(10).fill(2):fogPlan(c));}
function hiddenBag(random=Math.random){const bag=[],counts=Array(13).fill(0);while(bag.length<52){const i=Math.min(12,Math.floor(random()*13));if(counts[i]<50){bag.push(i*20);counts[i]++;}else {const j=counts.findIndex(c=>c<50);bag.push(j*20);counts[j]++;}}return bag;}
function fogFinish(type,contributions,random=Math.random,bag){const totals=contributions.map(SUM),group=SUM(totals),threshold=type==='certainty'?120:type==='risk'?Math.floor(random()*13)*20:bag[Math.min(bag.length-1,Math.floor(random()*bag.length))],success=group>=threshold;return {totals,group,threshold,success,earnings:totals.map(c=>(40-c)*(success?1:.1))};}

const field=(label,id,options,value)=>`<label class="field"><span>${label}</span><select id="${id}">${options.map(([v,l])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${l}</option>`).join('')}</select></label>`;

const humanNote='<p class="fine">A Nash equilibrium is a set of strategies where nobody gains in expected earnings by changing only their own strategy. Bots are mathematical benchmarks, not estimates of human behavior.</p>';

{
let qi=0,institution='messages',role='delegate',mode='provision',qStep='pledge',contribution=60,pledge=60,expect=180,qr=null,qScore=0;
gameGuide=`<h3>Four teams choose contributions</h3><p>Each team receives 120 points per one-shot round. A contribution is a whole number from 0 to 120. Contributions are spent even if the public good is not provided. If the group meets its target, each team keeps its remaining balance. If it misses, a common lottery causes a loss of 90% of that balance with probability p. The six cases follow the paper’s order: known target 240 with p=75%,55%,95%; then an equally likely target of 190 or 290 with p=95%,55%,75%.</p><h3>Delegation and messages</h3><p>No delegation: you receive the whole team payoff. Delegation without messages: you choose for a three-person team and earnings are divided by three. Delegation with messages: two constituents can send nonbinding recommendations to the representative. In that last treatment you can take the representative or constituent seat. These bots keep their contributions fixed irrespective of advice. The original practice and majority election are replaced by a directly assigned seat. Pledges and expectations about other teams are recorded but nonbinding; a constituent’s recommendation does not control the team’s contribution. Immediate outcome feedback replaces the study’s delayed results.</p><h3>Expected-payoff Nash verification</h3><p>No contribution is a Nash equilibrium in every case because one team cannot meet even the low target alone. “Verified provision” selects the highest-paying balanced integer profile that passes every unilateral 0–120 deviation. At a known 240 target, it prescribes 60 each for p=75% or 95%, and zero for p=55%. With two possible targets, it prescribes [48,48,47,47], totaling 190, for p=75% or 95%; at 55% it prescribes zero. You are Team A.</p><p><strong>Why these differ from parts of the paper’s Table 1:</strong> at exactly p=.55, the no-contribution expected payoff is 120×(1−.9×.55)=60.6, slightly above the 60 from contributing 60; the table’s stated tie reflects a rounded parameter. The balanced 290 target listed for p=.95 is not a Nash profile on the stated payoff rule: Team A can switch from 73 to zero while the others contribute 217, retaining 120×(1−.9×.95/2)=68.7 in expectation, above 47. The app preserves the paper’s parameters and uses independently verified equilibrium bots. A high target can be collectively attractive without being individually stable.</p><h3>Research</h3><p>İriş, Lee and Tavoni (2019), <cite>Delegation and Public Pressure in a Threshold Public Goods Game</cite>, Environmental and Resource Economics 74, 1331–1353. <a href="https://doi.org/10.1007/s10640-019-00371-6" target="_blank" rel="noopener">Paper ↗</a>. Rules follow equations (1) and (3) and Section 3. This is a different game from the collection’s <em>Mandate</em>, which adapts a later strategic-delegation paper.</p>${humanNote}`;
function qChamber(values){return `<div class="chamber" aria-label="Four team contributions">${values.map((v,i)=>`<div class="team-column"><div class="team-pillar" style="height:${55+(Number(v)||0)/120*80}px">${v}</div><small>TEAM ${'ABCD'[i]}${i===0?' · YOURS':''}</small></div>`).join('')}</div>`;}
function qRender(){const done=qi===6,c=QUORUM_CASES[Math.min(qi,5)],profile=quorumProfile(c,mode),members=institution==='solo'?1:3,adviser=institution==='messages'&&role==='adviser',target=c.uncertain?'190 or 290':'240';frame('QUORUM','DELEGATION / NONBINDING VOICE / SHARED RISK','One voice at the table.<br>Whose choice is it?','Represent your team or advise its delegate. Explore how a common target and uncertain losses shape the incentive to contribute.',`<div class="layout"><section class="panel"><div class="quorum-topline"><h2>${done?'The six cases are complete.':c.title}</h2><span>${done?'6 / 6':`CASE ${qi+1} / 6`}</span></div>${qChamber(qr?qr.xs:qStep==='pledge'?['?','?','?','?']:profile.map((v,i)=>i===0?'?':v))}${done?`<div class="dossier"><p class="eyebrow">SESSION RECORD</p><h2>${fmt(qScore)} personal points</h2><p>Compare the expected and realized outcomes in your record. The draws can change realized earnings even when choices stay the same.</p><button class="primary" id="again">Start again</button><button class="quiet-button" id="export">Download choices (CSV)</button></div>`:`<div class="stats">${stat('GROUP TARGET',target)}${stat('LOSS RISK IF MISSED',Math.round(c.p*100)+'%')}${stat('TEAM ENDOWMENT','120')}</div>${qStep==='pledge'?`<div class="dossier"><p class="eyebrow">01 / PUBLIC PLEDGES</p><h3>State your intention.</h3>${number(adviser?'Your representative’s pledge (recorded for comparison)':'Your team’s nonbinding pledge','pledge',pledge,0,120)}${number('Your estimate: other three teams’ total','expect',expect,0,360)}<p class="fine">The bots pledge ${profile.slice(1).join(', ')}. These announcements do not bind contributions.</p><button class="primary" id="pledge-confirm">Record pledge →</button></div>`:qStep==='action'?`<div class="dossier"><p class="eyebrow">02 / ${adviser?'CONSTITUENT RECOMMENDATION':'CONTRIBUTION DECISION'}</p>${institution==='messages'?`<div class="messages"><div class="message">${adviser?'Other constituent':'Constituent 1'} recommends<strong>${profile[0]}</strong></div><div class="message">${adviser?'Your representative’s benchmark':'Constituent 2 recommends'}<strong>${profile[0]}</strong></div></div>`:''}${number(adviser?'Your nonbinding recommendation':'Your team contribution','contribute',contribution,0,120)}<p class="fine">${adviser?`Your representative bot will contribute ${profile[0]} regardless of your recommendation. Your seat receives one third of the team payoff.`:institution==='solo'?'You represent yourself and receive the entire team payoff.':`You choose for three people. Each receives one third of the team payoff.`}</p><button class="primary" id="resolve">${adviser?'Send recommendation & resolve':'Confirm contribution & resolve'} →</button></div>`:`<section class="result"><p class="eyebrow">03 / THE COMMON OUTCOME</p><h3>${qr.success?'The target was met.':qr.loss?'The target was missed and the loss occurred.':'The target was missed; the loss draw spared the teams.'}</h3><p>Combined contribution ${SUM(qr.xs)}. Realized target ${qr.threshold}. ${qr.loss?'Every team lost 90% of its unspent balance.':'Teams kept their unspent balances.'}</p><div class="stats">${stat('YOUR TEAM · EXPECTED',fmt(qr.expected[0]))}${stat('YOUR TEAM · REALIZED',fmt(qr.realized[0]))}${stat('YOUR PERSONAL PAYOFF',fmt(qr.realized[0]/members))}</div><p class="fine">${adviser?`Your recommendation was ${contribution}; the representative contributed ${profile[0]}.`:`You pledged ${pledge} and contributed ${contribution}.`} Expected payoffs are calculated before both threshold and loss draws.</p><button class="primary" id="next">${qi===5?'View session record':'Next case →'}</button></section>`}`}</section><aside class="panel side"><h2>Your seat</h2>${field('Institution','institution',[['solo','No delegation · one person'],['delegation','Delegation · no messages'],['messages','Delegation · recommendations']],institution)}${field('Role with recommendations','role',[['delegate','Representative'],['adviser','Constituent / adviser']],role)}${field('Bot benchmark','benchmark',[['provision','Verified provision when stable'],['zero','No-contribution Nash']],mode)}<button class="quiet-button" id="apply">Apply & start over</button><div class="note"><strong>Bot plan for this case</strong><br>Team contributions: ${profile.join(' / ')}. Bots use the same verified profile after any pledge or message.</div><p class="fine">Provision can require coordination. Advice is nonbinding. These bots capture the monetary benchmark; they do not estimate real delegates’ response to pressure.</p><div class="seal">FOUR<br>TEAMS<br>ONE TARGET</div><p class="fine">Personal session points: <strong>${fmt(qScore)}</strong>.</p></aside></div>`);$('#apply').onclick=()=>{institution=$('#institution').value;role=$('#role').value;mode=$('#benchmark').value;qi=0;qScore=0;dataRows.length=0;qReset();};if(done){$('#again').onclick=()=>{qi=0;qScore=0;dataRows.length=0;qReset();};$('#export').onclick=()=>exportCSV('quorum',dataRows);return;}if(qStep==='pledge'){$('#pledge-confirm').onclick=()=>{pledge=Number($('#pledge').value);expect=Number($('#expect').value);if(!Number.isInteger(pledge)||pledge<0||pledge>120||!Number.isInteger(expect)||expect<0||expect>360){$('#live').textContent='Use whole numbers within the shown limits.';return;}qStep='action';qRender();};}if(qStep==='action')$('#resolve').onclick=()=>{contribution=Number($('#contribute').value);if(!Number.isInteger(contribution)||contribution<0||contribution>120){$('#live').textContent='Use a whole contribution from 0 to 120.';return;}qr=quorumRound(c,adviser?profile[0]:contribution,mode);qScore+=qr.realized[0]/members;dataRows.push({case:qi+1,institution,role:adviser?'adviser':'delegate',loss_probability:c.p,uncertain_target:c.uncertain,pledge,expected_others:expect,recommendation:adviser?contribution:'',contribution:qr.xs[0],group_contribution:SUM(qr.xs),threshold:qr.threshold,expected_personal:qr.expected[0]/members,realized_personal:qr.realized[0]/members});qStep='result';qRender();$('#live').textContent=`Your personal payoff is ${fmt(qr.realized[0]/members)} points.`;};if(qStep==='result')$('#next').onclick=()=>{qi++;qReset();};}
function qReset(){qr=null;qStep='pledge';const p=quorumProfile(QUORUM_CASES[Math.min(qi,5)],mode);contribution=p[0];pledge=p[0];expect=SUM(p.slice(1));qRender();}
qReset();

}</script></body></html>
