const sum = xs => xs.reduce((a,b)=>a+b,0);
function integer(value,min,max,label='value') { if(!Number.isInteger(value)||value<min||value>max)throw new RangeError(`${label} must be an integer from ${min} to ${max}`);return value; }
const MENU = [4,6,8,10,12];

// Gosnell & Tavoni (2017): demands are percentages of ORIGINAL wealth.
function bargainConfig(treatment='ASYM',role='poor') {
  if(!['SYM','ASYM','PSD','RSD','ASD'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['poor','rich'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment==='SYM';
  return {treatment,role,human:symmetric?0:role==='rich'?0:2,wealth:symmetric?Array(6).fill(100/6):[30,30,10,10,10,10]};
}
function bargainTarget(round) {integer(round,1,8,'round');return 60-10*Math.floor((round-1)/2);}
function bargainGroups(treatment) {return [...(['RSD','ASD'].includes(treatment)?[[0,1]]:[]),...(['PSD','ASD'].includes(treatment)?[[2,3,4,5]]:[])];}
function bargainCaps(config,round,humanVote=100) {
  integer(humanVote,0,100,'side-deal vote');
  const target=bargainTarget(round),caps=Array(6).fill(100),deals=[];
  for(const members of bargainGroups(config.treatment)) {
    const votes=members.map(i=>i===config.human?humanVote:target),cap=sum(votes)/members.length;
    members.forEach(i=>caps[i]=cap);deals.push({members,votes,cap});
  }
  return {caps,deals};
}
function bargainResolve(config,round,caps,humanDemand) {
  const target=bargainTarget(round),h=config.human;
  if(caps.length!==6||caps.some(c=>!Number.isFinite(c)||c<0||c>100))throw new RangeError('Invalid caps');
  if(!Number.isFinite(humanDemand)||humanDemand<0||humanDemand>caps[h]+1e-9||Math.abs(humanDemand*4-Math.round(humanDemand*4))>1e-7)throw new RangeError('Demand must be a legal quarter percentage point');
  const percentages=caps.map((cap,i)=>i===h?humanDemand:Math.min(target,cap));
  const demands=percentages.map((p,i)=>p*config.wealth[i]/100),total=sum(demands),agreement=total<=target+1e-9;
  const finished=agreement||round===8,payoffs=agreement?demands:finished?config.wealth.map(w=>w*.1):null;
  const other=sum(demands.filter((_,i)=>i!==h));
  const bestAgreement=other>target+1e-9?null:Math.max(0,Math.min(caps[h],Math.floor(((target-other)/config.wealth[h]*100+1e-9)*4)/4));
  return {round,target,percentages,demands,total,agreement,finished,payoffs,bestAgreement};
}

// Kim et al. (2025), p. 1415: incoming fines cannot remove more than
// contribution-stage earnings; outgoing punishment costs remain payable.
function civicResolve(contributions,punishments=Array.from({length:4},()=>Array(4).fill(0))) {
  if(contributions.length!==4||punishments.length!==4)throw new RangeError('Four teams are required');
  contributions.forEach(c=>integer(c,0,20,'contribution'));
  punishments.forEach((row,i)=>{if(row.length!==4)throw new RangeError('Four punishment entries required');row.forEach((p,j)=>{integer(p,0,5,'punishment');if(i===j&&p!==0)throw new RangeError('No self punishment');});});
  const total=sum(contributions),gross=contributions.map(c=>20-c+.4*total);
  const sent=punishments.map(sum),received=contributions.map((_,i)=>sum(punishments.map(row=>row[i])));
  const losses=gross.map((g,i)=>Math.min(g,3*received[i]));
  const payoffs=gross.map((g,i)=>Math.max(0,g-3*received[i])-sent[i]);
  return {contributions:[...contributions],punishments:punishments.map(r=>[...r]),total,gross,sent,received,losses,payoffs,destroyed:sum(gross)-sum(payoffs)};
}

// Heyen, Lohse & Tavoni (supplied working paper), Section 2.
function gobConfig(treatment='AL',role='high') {
  if(!['SH','SL','AH','AL'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['high','low'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment[0]==='S',cost=treatment[1]==='H'?11:9;
  const ideals=symmetric?[6,6,6]:[6,3,3],human=symmetric||role==='high'?0:1;
  const equilibrium=cost===11?[0,0,0]:symmetric?[2,2,2]:[6,0,0];
  return {treatment,role,symmetric,cost,ideals,human,equilibrium,efficientTotal:symmetric?6:3};
}
function gobResolve(quantities,ideals,cost,guesses=null) {
  if(quantities.length!==3||ideals.length!==3||![9,11].includes(cost))throw new RangeError('Invalid GoB setup');
  quantities.forEach(q=>integer(q,0,6,'production'));ideals.forEach(a=>{if(![3,6].includes(a))throw new RangeError('Ideal must be 3 or 6');});
  if(guesses){if(guesses.length!==3)throw new RangeError('Three forecasts required');guesses.forEach(g=>integer(g,0,12,'forecast'));}
  const total=sum(quantities),costs=quantities.map(q=>cost*q),mismatch=ideals.map(a=>10*Math.abs(total-a));
  const base=quantities.map((_,i)=>220-costs[i]-mismatch[i]);
  const bonuses=quantities.map((q,i)=>!guesses?0:Math.abs(guesses[i]-(total-q))===0?30:Math.abs(guesses[i]-(total-q))===1?20:0);
  return {quantities:[...quantities],total,costs,mismatch,base,bonuses,payoffs:base.map((p,i)=>p+bonuses[i])};
}
function gobBestResponses(config,human=config.human,others=config.equilibrium) {
  const values=Array.from({length:7},(_,q)=>{const profile=[...others];profile[human]=q;return gobResolve(profile,config.ideals,config.cost).base[human];});
  const maximum=Math.max(...values);return {values,maximum,choices:values.flatMap((v,q)=>v===maximum?[q]:[])};
}

// Schmid, Tavoni & Winkler (October 2026): exact 0.01 contribution grid.
// Integer numerators prevent rounding from fabricating profitable deviations.
function agentNumerator(treatment,b,p,q) {
  if(!['linear','quadratic'].includes(treatment)||!MENU.includes(b))throw new RangeError('Invalid agent parameters');
  integer(p,0,100,'own percentage');integer(q,0,100,'other percentage');const s=p+q;
  return treatment==='linear'?100*b*s-9*p*p:b*(3400*s-9*s*s)-162*p*p;
}
const agentDenominator = treatment => treatment==='linear'?10000:180000;
const agentPayoff = (treatment,b,p,q)=>agentNumerator(treatment,b,p,q)/agentDenominator(treatment);
function agentBestResponses(treatment,b,q) {
  const values=Array.from({length:101},(_,p)=>agentNumerator(treatment,b,p,q)),maximum=Math.max(...values);
  return {choices:values.flatMap((v,p)=>v===maximum?[p]:[]),maximum:maximum/agentDenominator(treatment)};
}
function continuousAgentEquilibrium(treatment,b1,b2) {return treatment==='linear'?[b1/18,b2/18]:[17*b1/(9*(18+b1+b2)),17*b2/(9*(18+b1+b2))];}
const agentCache=new Map();
function agentEquilibria(treatment,b1,b2) {
  const key=`${treatment}/${b1}/${b2}`;if(agentCache.has(key))return agentCache.get(key).map(x=>[...x]);
  const br1=Array.from({length:101},(_,q)=>agentBestResponses(treatment,b1,q).choices),br2=Array.from({length:101},(_,p)=>agentBestResponses(treatment,b2,p).choices),pairs=[];
  for(let p=0;p<=100;p++)for(const q of br2[p])if(br1[q].includes(p))pairs.push([p,q]);
  if(!pairs.length)throw new Error('No pure grid equilibrium');agentCache.set(key,pairs);return pairs.map(x=>[...x]);
}
function selectedAgentEquilibrium(treatment,b1,b2) {
  const exact=continuousAgentEquilibrium(treatment,b1,b2).map(x=>100*x);
  const candidates=agentEquilibria(treatment,b1,b2);
  candidates.sort((a,b)=>{const da=(a[0]-exact[0])**2+(a[1]-exact[1])**2,db=(b[0]-exact[0])**2+(b[1]-exact[1])**2;return Math.abs(da-db)>1e-9?da-db:b1<=b2?a[0]-b[0]:a[1]-b[1];});
  return [...candidates[0]];
}
function delegationOutcome(treatment,b1,b2) {
  const [p,q]=selectedAgentEquilibrium(treatment,b1,b2);
  return {parameters:[b1,b2],contributions:[p,q],agents:[agentPayoff(treatment,b1,p,q),agentPayoff(treatment,b2,q,p)],principals:[agentPayoff(treatment,8,p,q),agentPayoff(treatment,8,q,p)],equilibria:agentEquilibria(treatment,b1,b2)};
}
function principalBestResponses(treatment,other,seat=0) {
  integer(seat,0,1,'principal seat');
  const values=MENU.map(b=>{const [p,q]=seat===0?selectedAgentEquilibrium(treatment,b,other):selectedAgentEquilibrium(treatment,other,b);return seat===0?agentNumerator(treatment,8,p,q):agentNumerator(treatment,8,q,p);}),maximum=Math.max(...values);
  return {values:values.map(v=>v/agentDenominator(treatment)),maximum:maximum/agentDenominator(treatment),choices:MENU.filter((_,i)=>values[i]===maximum)};
}
function principalEquilibria(treatment) {
  return MENU.flatMap(a=>MENU.filter(b=>principalBestResponses(treatment,b,0).choices.includes(a)&&principalBestResponses(treatment,a,1).choices.includes(b)).map(b=>[a,b]));
}

const UI={
 $:s=>document.querySelector(s),
 n:(v,d=2)=>Number(v).toLocaleString('en-GB',{maximumFractionDigits:d}),
 money:v=>'£'+Number(v).toFixed(2),

 guide:content=>{const dialog=document.getElementById('guide');dialog.innerHTML=`<div class="guide-head"><strong>FIELD GUIDE</strong><button id="close-guide" aria-label="Close guide">Close ×</button></div>${content}<p class="privacy">Fictional earnings. Choices remain in browser memory and reset on refresh. CSV exports are created on your device. There are no analytics or game backend; the website host may keep ordinary access logs.</p>`;document.addEventListener('click',event=>{if(event.target.closest('[data-guide]'))dialog.showModal();if(event.target.closest('#close-guide'))dialog.close();});},
 csv:(filename,records)=>{if(!records.length)return;const keys=Object.keys(records[0]),quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const text=[keys.map(quote).join(','),...records.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},

};

const app=UI.$('#app');let settings={treatment:'quadratic',seat:'principal',ownB:8,otherB:8},chosen=6,phase='choice',trial=1,effort=44,result=null,records=[];
UI.guide(`<h2>Choose the agent, change the incentives</h2><p>Two principals each value a shared public good with benefit weight 8. Each principal chooses an agent with weight <strong>4, 6, 8, 10 or 12</strong>. A weight of 8 is self-representation. The selected agents then simultaneously choose contributions x between 0 and 1, in 0.01 steps.</p><h3>Payoffs</h3><p>An agent earns <strong>b × B(total contribution) − 9 × own contribution²</strong>. Their principal earns <strong>8 × B(total contribution) − 9 × that agent’s contribution²</strong>. These are separate payoffs; an agent’s earnings are not transferred to the principal. In the linear treatment B(X)=X. In the quadratic treatment B(X)=X × (17/9 − X/2). X is the sum of both contributions.</p><h3>Two seats</h3><p><strong>Principal seat:</strong> your opposing principal chooses 8 in the linear treatment and 6 in the quadratic treatment. You choose any agent from the menu. The two agent bots then play a selected Nash equilibrium for that pair of weights. Their contributions may change when you select a different agent: this is a complete contingent strategy, not learning from past trials.</p><p><strong>Agent seat:</strong> choose both benefit weights before the trial, then choose your contribution. The other agent commits to its selected subgame-equilibrium contribution without observing your move. It does not adjust to your actual deviation. A comparison shows all of your best responses to that fixed contribution.</p><h3>Why delegation can reduce cooperation</h3><p>With linear benefits an agent’s best contribution does not depend on the other’s contribution. A principal maximizes own earnings by choosing weight 8. With quadratic benefits, the agents’ efforts are strategic substitutes: lowering your agent’s weight can shift some effort to the other agent. Both principals then prefer weight 6 in equilibrium, reducing total provision. Self-representation by both would raise their payoffs, but either principal can gain by unilaterally delegating down.</p><h3>The grid matters</h3><p>The paper’s continuous contribution predictions are 4/9 (about 44.44%) at weights (8,8) in the linear treatment, and 17/45 (about 37.78%) at (6,6) in the quadratic treatment. This app computes exact best responses on the experimental 0.01 grid: the respective equilibria are (44%,44%) and (38%,38%). Displayed payoffs use those exact grid choices.</p><p>For quadratic weights (8,8), both (44%,45%) and (45%,44%) are grid equilibria. The app selects (44%,45%). Generally it selects a grid equilibrium closest to the continuous prediction, breaking any remaining tie by the lower contribution of player 1 when weights are equal (or of the lower-weight player otherwise). That continuation rule yields the principal equilibria (8,8) and (6,6). Graph lines show grid best responses; the grey line uses weight 8.</p><h3>Source and teaching choices</h3><p>Schmid, Tavoni & Winkler, <em>Strategic Delegation in a Standard Public Goods Game</em>, supplied October 2026 working paper. Sections 3.1–4.1 (pp. 1–5) and Appendix A.</p><p>The original backward implementation uses real previously recorded agents, 25 parameter-pair trials and no interim agent feedback. Here bots replace those participants and immediate feedback explains each independent trial. Currency conversion, recruitment, attention checks and real payments are omitted. Fictional points retain the payoff formulas; the PDF is not redistributed.</p>`);
const equilibriumB=()=>settings.treatment==='linear'?8:6;
function pair(){return settings.seat==='principal'?[chosen,equilibriumB()]:[settings.ownB,settings.otherB];}
function graph(t,b,q,p){const points=weight=>Array.from({length:101},(_,x)=>{const y=agentBestResponses(t,weight,x).choices[0];return `${60+4.6*x},${214-1.7*y}`;}).join(' ');return `<svg class="curve" viewBox="0 0 560 270" role="img" aria-label="Best own contribution against the other agent’s contribution; purple selected weight, dashed grey self-representation"><path class="grid-line" d="M60 44H520M60 129H520"/><path class="axis-line" d="M60 35V214H525"/><polyline class="curve-self" points="${points(8)}"/><polyline class="curve-chosen" points="${points(b)}"/><circle cx="${60+4.6*q}" cy="${214-1.7*p}" r="6"/><text x="8" y="48">100%</text><text x="22" y="133">50%</text><text x="29" y="218">0%</text><text x="54" y="237">0%</text><text x="280" y="237">50%</text><text x="490" y="237">100%</text><text x="125" y="263">Other agent’s contribution →</text><text x="62" y="22">Best own contribution</text></svg>`;}
function render(){const t=settings.treatment,principal=settings.seat==='principal',[b1,b2]=pair(),preview=delegationOutcome(t,b1,b2),[p,q]=preview.contributions;
 let decision='',explanation='';
 if(phase==='choice'){
 decision=principal?`<p class="stage-label">STAGE 01 / YOUR DELEGATION DECISION</p><h2>Who should act for you?</h2><p class="small">Your own benefit weight stays at 8. Your agent can value the public good less, equally or more. The other principal chooses <strong>${b2}</strong>.</p><div class="agent-menu">${MENU.map(b=>`<button class="agent-card ${b===chosen?'selected':''}" data-agent="${b}" aria-label="Choose agent weight ${b}" aria-pressed="${b===chosen}"><span class="agent-avatar" aria-hidden="true"></span><strong>${b}</strong><small>${b===8?'SELF':'BENEFIT'}<br>${b===8?'REPRESENTATION':'WEIGHT'}</small></button>`).join('')}</div><p class="self-label">Lower weight: the agent cares less about public provision.<br>Higher weight: the agent cares more. You still receive the principal’s weight-8 payoff.</p><button class="primary" id="submit">Send the mandate →</button>`:`<p class="stage-label">STAGE 02 / YOUR CONTRIBUTION DECISION</p><h2>You are the agent.</h2><p class="small">Your benefit weight is ${b1}; the other agent’s is ${b2}. The other agent commits to <strong>${q}%</strong>, from the selected grid equilibrium. It will not change after seeing your choice.</p><label><span>Your contribution · percentage of one unit</span><div class="percent-input"><input id="effort" type="number" min="0" max="100" step="1" value="${effort}"><span>%<br>0–100, in steps of 1.</span></div></label><input id="effort-range" aria-label="Your contribution percentage slider" type="range" min="0" max="100" step="1" value="${effort}"><p class="small" id="effort-note">Your cost: ${UI.n(9*(effort/100)**2,4)} points.</p><button class="primary" id="submit">Commit my contribution →</button>`;
 explanation=`<p class="stage-label">INCENTIVES / PREVIEW</p><h2>${t==='linear'?'Independent efforts.':'Efforts are substitutes.'}</h2><p class="small">${t==='linear'?'The agent’s best contribution is the same whatever the other agent does. Choosing weight 8 is optimal for a principal.':'The more the other agent contributes, the less your agent wants to contribute. This creates an incentive to delegate to someone who values the public good less.'}</p>${graph(t,b1,q,p)}<p class="small muted">Purple: weight ${b1}. Dashed: weight 8. Dot: selected agent equilibrium for weights (${b1}, ${b2}).</p><div class="mandate-chain"><div class="chain-node">You value the good at<strong>${principal?8:b1}</strong>${principal?'principal weight':'agent weight'}</div><span class="chain-arrow">→</span><div class="chain-node">${principal?'You delegate to':'The other agent has'}<strong>${principal?b1:b2}</strong>benefit weight</div></div><p class="equation">${t==='linear'?'B(X) = X':'B(X) = X × (17/9 − X/2)'}<br>Cost(x) = 9 × x²</p>`;
 }else{const own=result.principals[0],agent=result.agents[0],best=principal?principalBestResponses(t,b2):agentBestResponses(t,b1,result.contributions[1]);decision=`<p class="stage-label">TRIAL ${String(trial).padStart(2,'0')} / SETTLED</p><h2>${principal?'The agents carried out your mandate.':'Your contribution is in.'}</h2><div class="number-board"><div><span class="label">${principal?'Your principal payoff':'Your agent payoff'}</span><strong>${UI.n(principal?own:agent,4)}</strong><small>fictional points</small></div><div><span class="label">${principal?'Your agent payoff':'Your principal payoff'}</span><strong>${UI.n(principal?agent:own,4)}</strong><small>separate earnings</small></div></div>${result.contributions.map((v,i)=>`<div class="effort-row"><span>${i===0?'Your side’s agent':'Other side’s agent'} · weight ${i===0?b1:b2}</span><strong>${v}%</strong></div><div class="effort-track ${i===1?'other':''}"><div style="width:${v}%"></div></div>`).join('')}<div class="result-note" style="margin-top:22px">${principal?`Against the other principal’s fixed weight ${b2}, your best delegation choice${best.choices.length>1?'s are':' is'} ${best.choices.join(' or ')}, giving ${UI.n(best.maximum,4)}. ${best.choices.includes(b1)?'You selected a best response.':'This trial illustrates a deviation from the equilibrium delegation choice.'}`:`Against the other agent’s fixed ${result.contributions[1]}%, your best contribution${best.choices.length>1?'s are':' is'} ${best.choices.map(x=>x+'%').join(' or ')}, giving ${UI.n(best.maximum,4)}. ${best.choices.includes(result.contributions[0])?'Your action is a best response.':'Your choice gives up some own earnings.'}`}</div><div class="button-row"><button class="primary" id="again">New trial →</button><button class="secondary" id="csv">Export trials</button></div>`;
 explanation=`<p class="stage-label">OUTCOME / BOTH SIDES</p><h2>Same public benefit.<br>Different incentives.</h2>${UI.table(['Side','Agent weight','Contribution','Agent payoff','Principal payoff'],[0,1].map(i=>[i===0?'Your side':'Other side',[b1,b2][i],result.contributions[i]+'%',UI.n(result.agents[i],4),UI.n(result.principals[i],4)]))}<p class="small">Contributions are fractions of one unit: 44% means x=0.44. The principal’s benefit weight is always 8.</p>${principal?`<details open><summary>Compare all five delegation choices</summary>${UI.table(['Your agent weight','Your principal payoff'],MENU.map((b,i)=>[`${b}${b===b1?' · selected':''}${best.choices.includes(b)?' · best':''}`,UI.n(best.values[i],4)]))}</details>`:`<details><summary>What does the selected agent equilibrium predict?</summary><p>For these weights, the selected profile is (${p}%, ${q}%). You chose ${result.contributions[0]}%; the other agent kept ${q}%. Human deviations need not yield equilibrium play.</p></details>`}<p class="small">${t==='quadratic'?'In the selected full-game equilibrium both principals choose weight 6 and both agents contribute 38%. If both principals self-represent at weight 8, the selected grid equilibrium contributes 44% and 45%. Both principals then earn more, but either has an incentive to delegate down.':'In the full-game equilibrium both principals self-represent at weight 8 and each agent contributes 44% on the experimental grid.'}</p>${preview.equilibria.length>1?`<p class="small">Grid multiplicity: this pair also permits ${preview.equilibria.map(e=>'('+e[0]+'%, '+e[1]+'%)').join(' and ')}. The selection rule is explained in the field guide.</p>`:''}`;
 }
 app.innerHTML=`<header class="mandate-header"><div class="inner"><a class="mandate-brand" href="games.html">MANDATE /</a><nav><a href="games.html">All games</a><button class="text-button" data-guide>Model notes ↗</button></nav></div></header><main id="main" class="mandate-main"><div class="mandate-intro"><div><p class="eyebrow">SCHMID · TAVONI · WINKLER / THE DELEGATION GAME</p><h1>Choose who acts for you.<br>Change what happens next.</h1><p>Should you choose someone who cares as much as you do—or someone who cares less? Explore both stages of a principal–agent game.</p></div><div class="trial-id">TRIAL / ${String(trial).padStart(2,'0')}</div></div><section class="mandate-config" aria-label="Trial configuration"><label><span>Benefit function</span><select id="treatment" ${phase==='result'?'disabled':''}>${UI.options([['linear','Linear · constant marginal benefit'],['quadratic','Quadratic · decreasing marginal benefit']],t)}</select></label><div><p class="small" style="margin:0 0 7px;font-weight:650">Your seat</p><div class="seat-switch"><button id="principal-seat" class="${principal?'active':''}" ${phase==='result'?'disabled':''} aria-pressed="${principal}">Principal</button><button id="agent-seat" class="${!principal?'active':''}" ${phase==='result'?'disabled':''} aria-pressed="${!principal}">Agent</button></div></div>${!principal?`<label><span>Your agent weight</span><select id="own-b" ${phase==='result'?'disabled':''}>${UI.options(MENU.map(b=>[b,b]),settings.ownB)}</select></label><label><span>Other agent weight</span><select id="other-b" ${phase==='result'?'disabled':''}>${UI.options(MENU.map(b=>[b,b]),settings.otherB)}</select></label>`:''}</section><div class="exchange"><section class="exchange-panel" aria-label="Your decision">${decision}</section><aside class="exchange-panel">${explanation}</aside></div><footer class="mandate-footer"><span>Based on the supplied October 2026 working paper. Exact grid equilibria; fictional points.</span><button class="text-button" data-guide>Complete rules & adaptations ↗</button></footer></main>`;
 const refreshEffort=()=>{const [a,b]=pair();effort=selectedAgentEquilibrium(settings.treatment,a,b)[0];};
 UI.on('treatment','change',e=>{settings.treatment=e.target.value;chosen=equilibriumB();refreshEffort();render();});UI.on('principal-seat','click',()=>{settings.seat='principal';chosen=equilibriumB();render();});UI.on('agent-seat','click',()=>{settings.seat='agent';refreshEffort();render();});UI.on('own-b','change',e=>{settings.ownB=Number(e.target.value);refreshEffort();render();});UI.on('other-b','change',e=>{settings.otherB=Number(e.target.value);refreshEffort();render();});document.querySelectorAll('[data-agent]').forEach(button=>button.addEventListener('click',()=>{chosen=Number(button.dataset.agent);render();}));
 const sync=(from,to)=>{effort=Number(UI.$(from).value);UI.$(to).value=effort;UI.$('#effort-note').textContent=`Your cost: ${UI.n(9*(effort/100)**2,4)} points.`;};UI.on('effort','input',()=>sync('#effort','#effort-range'));UI.on('effort-range','input',()=>sync('#effort-range','#effort'));
 UI.on('submit','click',()=>{if(!principal&&!UI.$('#effort').reportValidity())return;const outcome=delegationOutcome(t,b1,b2);if(!principal){outcome.contributions[0]=Number(UI.$('#effort').value);const [a,b]=outcome.contributions;outcome.agents=[agentPayoff(t,b1,a,b),agentPayoff(t,b2,b,a)];outcome.principals=[agentPayoff(t,8,a,b),agentPayoff(t,8,b,a)];}result=outcome;records.push({trial,seat:settings.seat,treatment:t,own_agent_weight:b1,other_agent_weight:b2,own_contribution_percent:result.contributions[0],other_contribution_percent:result.contributions[1],own_agent_payoff:result.agents[0],other_agent_payoff:result.agents[1],own_principal_payoff:result.principals[0],other_principal_payoff:result.principals[1],selected_agent_equilibrium:p+'/'+q});phase='result';render();UI.focus();});
 UI.on('again','click',()=>{trial++;phase='choice';chosen=equilibriumB();refreshEffort();render();UI.focus();});UI.on('csv','click',()=>UI.csv('mandate-trials.csv',records));
}
effort=selectedAgentEquilibrium(settings.treatment,settings.ownB,settings.otherB)[0];render();

}
</script></body></html>
