</style></head><body><div id="app"></div><dialog id="guide" aria-label="Rules and research"></dialog><noscript>Enable JavaScript to play this game.</noscript><script type="module">const SUM=a=>a.reduce((x,y)=>x+y,0);
const NET_NAMES={complete:'Complete network',circle:'Undirected circle',directed:'Directed circle'};
function neighbors(i,type){return [0,1,2,3].filter(j=>j!==i&&(type==='complete'||j===(i+1)%4||(type==='circle'&&j===(i+3)%4)));}
function extractionPayoffs(xs){const X=SUM(xs);return xs.map(x=>125+20*x-.25*x*X);}
function networkRound(x,type,punishments=[0,0,0,0],seat=0){
 if(!Number.isInteger(x)||x<0||x>25||!Object.keys(NET_NAMES).includes(type))throw Error('Invalid network choice');
 const xs=Array(4).fill(16);xs[seat]=x;const first=extractionPayoffs(xs),allowed=neighbors(seat,type),spent=SUM(punishments);
 if(punishments.length!==4||punishments.some((p,j)=>!Number.isInteger(p)||p<0||(p>0&&!allowed.includes(j)))||spent>Math.floor(first[seat]))throw Error('Invalid punishment budget or target');
 const final=first.map((v,j)=>Math.max(0,v-(j===seat?spent:3*punishments[j])));
 return {xs,first,final,spent,allowed,total:final[seat]};
}
const CATALYST_CASES=[
 {id:'T0',title:'No coalition',coalition:false,innovation:0,spill:false},
 {id:'T1',title:'Coalition only',coalition:true,innovation:0,spill:false},
 {id:'T2',title:'Low innovation · members only',coalition:true,innovation:.02,spill:false},
 {id:'T3',title:'Low innovation · spillovers',coalition:true,innovation:.02,spill:true},
 {id:'T4',title:'High innovation · members only',coalition:true,innovation:.07,spill:false},
 {id:'T5',title:'High innovation · spillovers',coalition:true,innovation:.07,spill:true}
];
function prescribedMembers(t){return t.id==='T0'?[]:t.id==='T4'?[0,1,2,3,4,5,6]:[0,1];}
const memberA=s=>2*s+1;
function coalitionActions(t,members){const s=members.length;if(s<2)return Array(7).fill(50);return Array.from({length:7},(_,i)=>members.includes(i)?memberA(s):(105-s*memberA(s))/(7-s));}
function coalitionPayoffs(t,members,actions){const s=members.length,formed=t.coalition&&s>=2,X=SUM(actions),gross=actions.map((a,i)=>{const b=6*(1+(formed&&(members.includes(i)||t.spill)?s*t.innovation:0));return 10*a+b*(50-a)-X;});return {X,gross,expected:gross.map(v=>v*(X>105+1e-8?.5:1)),crossed:X>105+1e-8};}
function catalystRound(t,join,action,seat=6,baseline='safe',coin=.9){
 if(!CATALYST_CASES.includes(t))throw Error('Invalid treatment');
 let members=prescribedMembers(t).filter(i=>i!==seat);if(t.coalition&&join)members.push(seat);if(!t.coalition)members=[];
 const formed=members.length>=2,actions=t.coalition?coalitionActions(t,members):Array(7).fill(baseline==='safe'?15:50);
 const bound=formed&&members.includes(seat);
 if(!bound){if(!Number.isInteger(action)||action<0||action>50)throw Error('Invalid investment');actions[seat]=action;}
 const r=coalitionPayoffs(t,members,actions),lost=r.crossed&&coin<.5;
 return {...r,members,formed,bound,actions,lost,realized:r.gross.map(v=>lost?0:v),total:lost?0:r.gross[seat],seat};
}
const QUORUM_CASES=[{title:'Known target · 75% loss risk',p:.75,uncertain:false},{title:'Known target · 55% loss risk',p:.55,uncertain:false},{title:'Known target · 95% loss risk',p:.95,uncertain:false},{title:'Two targets · 95% loss risk',p:.95,uncertain:true},{title:'Two targets · 55% loss risk',p:.55,uncertain:true},{title:'Two targets · 75% loss risk',p:.75,uncertain:true}];
function quorumSurvival(c,total){return c.uncertain?(total>=290?1:total>=190?1-.45*c.p:1-.9*c.p):(total>=240?1:1-.9*c.p);}
function quorumExpected(c,xs){const s=quorumSurvival(c,SUM(xs));return xs.map(x=>(120-x)*s);}
const balanced=(total,n)=>Array.from({length:n},(_,i)=>Math.floor(total/n)+(i<total%n?1:0));
function isQuorumNash(c,xs){const pay=quorumExpected(c,xs);return xs.every((_,i)=>Array.from({length:121},(_,d)=>{const a=[...xs];a[i]=d;return quorumExpected(c,a)[i]<=pay[i]+1e-9;}).every(Boolean));}
function quorumProfile(c,mode='provision'){
 if(mode==='zero')return [0,0,0,0];
 const candidates=[0,...(c.uncertain?[190,290]:[240])].map(t=>balanced(t,4)).filter(xs=>isQuorumNash(c,xs));
 return candidates.sort((a,b)=>SUM(quorumExpected(c,b))-SUM(quorumExpected(c,a)))[0];
}
function quorumRound(c,x,mode='provision',seat=0,random=Math.random){
 if(!Number.isInteger(x)||x<0||x>120)throw Error('Invalid contribution');
 const xs=quorumProfile(c,mode);xs[seat]=x;const threshold=c.uncertain?(random()<.5?190:290):240,success=SUM(xs)>=threshold,loss=!success&&random()<c.p;
 return {xs,threshold,success,loss,expected:quorumExpected(c,xs),realized:xs.map(x=>(120-x)*(loss?.1:1)),total:(120-x)*(loss?.1:1)};
}
const FOGLINE_PROFILES={certainty:{provision:[20,20,20,20,20,20],zero:[0,0,0,0,0,0]},risk:{zero:[0,0,0,0,0,0],small:[4,4,4,4,2,2],medium:[8,8,6,6,6,6]},ambiguity:{robust:[0,0,0,0,0,0]}};
function fogCDF(type,total,bag){if(type==='certainty')return total>=120?1:0;if(type==='risk')return Math.min(13,Math.floor(total/20)+1)/13;if(!bag)throw Error('No probability supplied for ambiguity');return SUM(bag.filter(t=>t<=total).map(()=>1))/bag.length;}
function fogExpected(type,own,others,bag){return (40-own)*(.1+.9*fogCDF(type,own+others,bag));}
function fogPlan(total){if(total<0||total>40||total%2)throw Error('Invalid planned contribution');const a=[];for(let i=0;i<10;i++){const x=Math.min(4,total);a.push(x);total-=x;}return a;}
function fogSchedule(type,mode){return FOGLINE_PROFILES[type][mode].map(c=>type==='certainty'&&mode==='provision'?Array(10).fill(2):fogPlan(c));}
function hiddenBag(random=Math.random){const bag=[],counts=Array(13).fill(0);while(bag.length<52){const i=Math.min(12,Math.floor(random()*13));if(counts[i]<50){bag.push(i*20);counts[i]++;}else {const j=counts.findIndex(c=>c<50);bag.push(j*20);counts[j]++;}}return bag;}
function fogFinish(type,contributions,random=Math.random,bag){const totals=contributions.map(SUM),group=SUM(totals),threshold=type==='certainty'?120:type==='risk'?Math.floor(random()*13)*20:bag[Math.min(bag.length-1,Math.floor(random()*bag.length))],success=group>=threshold;return {totals,group,threshold,success,earnings:totals.map(c=>(40-c)*(success?1:.1))};}

const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),fmt=x=>x.toLocaleString('en-GB',{maximumFractionDigits:2});
const dataRows=[];
let gameGuide='';
function frame(name,tag,title,copy,content){$('#app').innerHTML=`<a class="skip" href="#main">Skip to game</a><header><div class="wrap"><a class="brand" href="games.html">${name}</a><nav><a href="games.html">All games ↗</a><button class="quiet-button" id="rules">Rules & research</button></nav></div></header><main class="wrap" id="main"><div class="intro"><div><p class="eyebrow">${tag}</p><h1>${title}</h1></div><p class="intro-copy">${copy}</p></div>${content}<p class="live" id="live" role="status" aria-live="polite"></p></main><footer><div class="wrap"><span>Classroom adaptation · Fictional points · Bots follow the disclosed benchmark.</span><a href="https://github.com/aletavoni/common-ground">View collection source ↗</a></div></footer>`;$('#rules').onclick=()=>openGuide(name,gameGuide);}
function openGuide(name,html){const d=$('#guide');d.innerHTML=`<div class="guide-head"><h2>${name}: rules & research</h2><button id="close-guide" class="quiet-button">Close</button></div><div class="guide-body">${html}<h3>Teaching adaptation and data</h3><p>This app uses fictional cumulative points, immediate feedback and the stated bots. It does not reproduce the experiment’s participants, matching pool, practice tasks or monetary payment. Human deviations need not produce equilibrium play. There are no accounts or analytics. Choices stay in this page’s memory and reset on refresh; downloads are created locally. Ordinary hosting access logs may exist.</p></div>`;d.showModal();$('#close-guide').onclick=()=>d.close();}
function exportCSV(name,rows){const keys=Object.keys(rows[0]||{}),escape=x=>'"'+String(x??'').replaceAll('"','""')+'"',text=[keys.map(escape).join(','),...rows.map(r=>keys.map(k=>escape(r[k])).join(','))].join('\r\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const stat=(label,value)=>`<div class="stat"><span>${label}</span><strong>${value}</strong></div>`;
const field=(label,id,options,value)=>`<label class="field"><span>${label}</span><select id="${id}">${options.map(([v,l])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${l}</option>`).join('')}</select></label>`;
const number=(label,id,value,min,max,step=1)=>`<label class="field"><span>${label}</span><input type="number" id="${id}" value="${value}" min="${min}" max="${max}" step="${step}" inputmode="numeric"></label>`;
const humanNote='<p class="fine">A Nash equilibrium is a set of strategies where nobody gains in expected earnings by changing only their own strategy. Bots are mathematical benchmarks, not estimates of human behavior.</p>';

{
let fogType='certainty',fogMode='provision',turn=0,fRows=[],fTotals=Array(6).fill(0),fChoice=2,pledgeDone=false,fPledges=[],bag=hiddenBag(),finish=null;
const fogModeNames={provision:'Provision Nash · total 120',zero:'Zero-contribution Nash',small:'Asymmetric Nash · total 20',medium:'Asymmetric Nash · total 40',robust:'Robust maximin · zero'};
gameGuide=`<h3>Build a shared fund over ten rounds</h3><p>Six players start with 40 points each. In each of 10 rounds, every player contributes 0, 2 or 4 to the common account. Contributions are spent. At the end, if the common total reaches or exceeds the realized threshold, everyone keeps their private remainder; otherwise everyone loses 90% of it. There are nonbinding group-target proposals before rounds 1 and 6.</p><h3>Three information treatments</h3><ul><li><strong>Certainty:</strong> target 120 is known.</li><li><strong>Risk:</strong> 13 equally likely targets, 0,20,…,240. The final target is drawn once at the end; all players face the same target.</li><li><strong>Ambiguity:</strong> the same possible targets but unknown probabilities. A simulated bag of 52 balls is prepared privately at the start and its composition is revealed at the end. No target can have more than 50 balls. This is a teaching replacement for the study’s distribution set by a volunteer. The generator is not estimated from experimental data.</li></ul><h3>Bots and equilibrium selection</h3><p>For Certainty, the default profile contributes 2 per person each round, totaling 120; you may also choose all-zero bots. For Risk, choose zero, total 20 with player totals [4,4,4,4,2,2], or total 40 with totals [8,8,6,6,6,6]. You occupy the first seat. The nonzero risk schedules contribute early, at most 4 per round, then stop. Each profile is checked against every feasible alternative own total 0,2,…,40. The schedule is fixed regardless of your choices or proposals. This is a selected whole-game Nash benchmark against fixed schedules; no claim of subgame perfection after every possible history is made.</p><p>Risk’s expected personal payoff is (40−own total)×[.1+.9×(number of covered thresholds/13)]. The collectively efficient total of 100 under Risk is not the selected Nash prediction. Choosing a different timing with the same total against these fixed bots leaves final expected earnings unchanged.</p><p><strong>Ambiguity is different:</strong> without a probability distribution or a belief model there is no unique expected-payoff Nash prediction. Bots use the robust <em>maximin</em> benchmark: zero contribution maximizes their worst-case retained balance. The minimum payoff from contributing c is .1×(40−c), which is largest at zero. This is labelled robust maximin throughout the app, rather than being presented as a unique Nash equilibrium.</p><h3>Research</h3><p>Dannenberg, Löschel, Paolacci, Reif and Tavoni (2015), <cite>On the Provision of Public Goods with Probabilistic and Ambiguous Thresholds</cite>, Environmental and Resource Economics 61, 365–383. <a href="https://doi.org/10.1007/s10640-014-9796-6" target="_blank" rel="noopener">Paper ↗</a>. Rules follow Sections 2–3. The app preserves 6 players, 40-point budgets, 10 rounds and the three actions. Bots replace participants; exact choices and balances are shown after each round, with an added coverage display. Nonbinding proposals do not change bots’ fixed schedules. Original payment and questionnaires are omitted.</p>${humanNote}`;
function fogOptions(){return Object.keys(FOGLINE_PROFILES[fogType]).map(v=>[v,fogModeNames[v]]);}
function fRender(){const plans=fogSchedule(fogType,fogMode),done=!!finish,total=SUM(fTotals),profile=FOGLINE_PROFILES[fogType][fogMode],needsPledge=!done&&(turn===0||turn===5)&&!pledgeDone;frame('FOGLINE','CERTAINTY / RISK / AMBIGUITY','How much is enough<br>when the target is hidden?','Build a common fund over ten rounds. Compare a known target, known odds and a bag whose probabilities you do not know.',`<div class="layout"><section class="panel"><div class="forecast"><span>${fogType.toUpperCase()} / ${fogType==='ambiguity'?'UNKNOWN PROBABILITIES':fogType==='risk'?'13 EQUALLY LIKELY TARGETS':'KNOWN TARGET 120'}</span><span>${done?'SESSION COMPLETE':`ROUND ${turn+1} / 10`}</span></div><div class="fog-banner"><p class="eyebrow">COMMON CONTRIBUTIONS</p><span class="counter">${total}</span><p class="fine">${done?`The realized threshold was ${finish.threshold}. ${finish.success?'The target was reached.':'The target was missed.'}`:fogType==='certainty'?`${Math.max(0,120-total)} more points would reach the target.`:fogType==='risk'?`If the game ended now, ${Math.min(13,Math.floor(total/20)+1)} of 13 thresholds would be covered.`:'Possible thresholds are known. Their probabilities are not.'}</p><div class="horizon" role="progressbar" aria-label="Common contribution out of the total 240 budget" aria-valuenow="${total}" aria-valuemin="0" aria-valuemax="240"><span style="width:${total/240*100}%"></span></div><div class="urn" aria-label="Possible thresholds and whether the common account covers them">${Array.from({length:13},(_,i)=>`<span class="ball ${i*20<=total?'covered':''} ${done&&finish.threshold===i*20?'actual':''}" title="Threshold ${i*20}${i*20<=total?' is covered':' is not covered'}">${i*20}</span>`).join('')}</div><p class="fine">${fogType==='certainty'?'Only 120 is the operative target; the row is a scale.':fogType==='risk'?'Each target has probability 1/13.':done?'The outlined ball is the realized target. See the revealed bag below.':'Equal-sized markers show locations, not equal probabilities.'}</p></div><div class="balance-grid">${fTotals.map((v,i)=>`<div class="balance"><span>${i===0?'YOU':'BOT '+i}</span><strong>${40-v}</strong><small>gave ${v}</small></div>`).join('')}</div>${done?`<section class="fogline-result"><p class="eyebrow">FINAL COMMON DRAW</p><h2>${finish.success?'The group keeps its balances.':'Only 10% of private balances remain.'}</h2><div class="stats">${stat('YOUR CONTRIBUTION',fTotals[0])}${stat('REALIZED THRESHOLD',finish.threshold)}${stat('YOUR FINAL PAYOFF',fmt(finish.earnings[0]))}</div><p>${fogType==='ambiguity'?'No expected payoff is asserted without specifying beliefs about the unknown bag.':`Your expected payoff before the threshold draw was ${fmt(fogExpected(fogType,fTotals[0],total-fTotals[0]))} points. A realized payoff can differ from this expectation.`}</p>${fogType==='ambiguity'?`<h3>The bag, revealed</h3><p class="fine">Number of balls at each possible threshold, totaling 52:</p><div class="bag-counts">${Array.from({length:13},(_,i)=>`<span>${i*20}<strong>${bag.filter(x=>x===i*20).length}</strong></span>`).join('')}</div>`:''}<button class="primary" id="again">Start another session</button><button class="quiet-button" id="export">Download choices (CSV)</button></section>`:needsPledge?`<section class="fog-pledge"><p class="eyebrow">BEFORE ROUND ${turn+1} / A NONBINDING PROPOSAL</p><h3>What should the group aim for?</h3>${number('Your proposed final group total','proposal',SUM(profile),0,240)}<p class="fine">Bots propose ${SUM(profile)}. Your proposal is recorded, but it does not bind anyone or change their strategy.</p><button class="primary" id="pledge">Announce proposal →</button></section>`:`<p class="fine">Your prescribed benchmark contribution this round is <strong>${plans[0][turn]}</strong>. Try that choice or explore a deviation. Everyone chooses simultaneously.</p><div class="contribute-buttons" aria-label="Your round contribution">${[0,2,4].map(x=>`<button data-contribute="${x}" aria-pressed="${x===fChoice}">${x}<small>POINTS</small></button>`).join('')}</div><button class="primary" id="contribute">Contribute ${fChoice} & reveal round →</button>`}${fRows.length?`<section class="history fog-history"><h3>Round record</h3><table class="ledger"><thead><tr><th>Round</th><th>You</th><th>B1</th><th>B2</th><th>B3</th><th>B4</th><th>B5</th><th>Total</th></tr></thead><tbody>${fRows.map((xs,i)=>`<tr><td>${i+1}</td>${xs.map(v=>`<td>${v}</td>`).join('')}<td>${SUM(xs)}</td></tr>`).join('')}</tbody></table></section>`:''}</section><aside class="panel side"><h2>Information settings</h2>${field('Treatment · changing starts over','fog-type',[['certainty','Certainty · target 120'],['risk','Risk · uniform target'],['ambiguity','Ambiguity · hidden bag']],fogType)}${field('Bot benchmark · changing starts over','fog-mode',fogOptions(),fogMode)}<button class="quiet-button" id="restart">Restart this treatment</button><div class="note"><strong>${fogType==='ambiguity'?'Robust bot plan':'Selected Nash plan'}</strong><br>Final contributions by seat: ${profile.join(' / ')}. You are the first seat. Bots follow their fixed ten-round schedules.</div><p class="fine">All start with 40 points. No money is paid during the ten rounds; only the final private balance can survive the common threshold draw.</p><p class="fine">A higher common fund may protect more of the possible targets, but it also leaves less private money to protect.</p></aside></div>`);$('#fog-type').onchange=e=>{fogType=e.target.value;fogMode=Object.keys(FOGLINE_PROFILES[fogType])[0];fReset();};$('#fog-mode').onchange=e=>{fogMode=e.target.value;fReset();};$('#restart').onclick=fReset;if(done){$('#again').onclick=fReset;$('#export').onclick=()=>exportCSV('fogline',dataRows);return;}if(needsPledge)$('#pledge').onclick=()=>{const p=Number($('#proposal').value);if(!Number.isInteger(p)||p<0||p>240){$('#live').textContent='Choose a whole group target between 0 and 240.';return;}fPledges.push({before_round:turn+1,proposal:p});pledgeDone=true;fRender();};else{$$('[data-contribute]').forEach(b=>b.onclick=()=>{fChoice=Number(b.dataset.contribute);fRender();});$('#contribute').onclick=()=>{const xs=plans.map((plan,i)=>i===0?fChoice:plan[turn]);fRows.push(xs);fTotals=fTotals.map((v,i)=>v+xs[i]);dataRows.push({round:turn+1,treatment:fogType,benchmark:fogMode,own_contribution:fChoice,group_round:SUM(xs),group_total:SUM(fTotals),own_private:40-fTotals[0],proposal:fPledges.at(-1)?.proposal});turn++;if(turn===5)pledgeDone=false;if(turn===10){finish=fogFinish(fogType,Array.from({length:6},(_,i)=>fRows.map(row=>row[i])),Math.random,bag);}fRender();$('#live').textContent=finish?`Final payoff: ${fmt(finish.earnings[0])} points.`:`Round ${turn} complete. Common fund ${SUM(fTotals)}.`;};}}
function fReset(){turn=0;fRows=[];fTotals=Array(6).fill(0);finish=null;pledgeDone=false;fPledges=[];dataRows.length=0;bag=hiddenBag();fChoice=fogSchedule(fogType,fogMode)[0][0];fRender();}
fReset();

}</script></body></html>
