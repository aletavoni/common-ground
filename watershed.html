</style></head><body><div id="app"></div><dialog id="guide" aria-label="Rules and research"></dialog><noscript>Enable JavaScript to play this game.</noscript><script type="module">const SUM=a=>a.reduce((x,y)=>x+y,0);
const NET_NAMES={complete:'Complete network',circle:'Undirected circle',directed:'Directed circle'};
function neighbors(i,type){return [0,1,2,3].filter(j=>j!==i&&(type==='complete'||j===(i+1)%4||(type==='circle'&&j===(i+3)%4)));}
function extractionPayoffs(xs){const X=SUM(xs);return xs.map(x=>125+20*x-.25*x*X);}
function networkRound(x,type,punishments=[0,0,0,0],seat=0){
 if(!Number.isInteger(x)||x<0||x>25||!Object.keys(NET_NAMES).includes(type))throw Error('Invalid network choice');
 const xs=Array(4).fill(16);xs[seat]=x;const first=extractionPayoffs(xs),allowed=neighbors(seat,type),spent=SUM(punishments);
 if(punishments.length!==4||punishments.some((p,j)=>!Number.isInteger(p)||p<0||(p>0&&!allowed.includes(j)))||spent>Math.floor(first[seat]))throw Error('Invalid punishment budget or target');
 const final=first.map((v,j)=>Math.max(0,v-(j===seat?spent:3*punishments[j])));
 return {xs,first,final,spent,allowed,total:final[seat]};
}
const CATALYST_CASES=[
 {id:'T0',title:'No coalition',coalition:false,innovation:0,spill:false},
 {id:'T1',title:'Coalition only',coalition:true,innovation:0,spill:false},
 {id:'T2',title:'Low innovation · members only',coalition:true,innovation:.02,spill:false},
 {id:'T3',title:'Low innovation · spillovers',coalition:true,innovation:.02,spill:true},
 {id:'T4',title:'High innovation · members only',coalition:true,innovation:.07,spill:false},
 {id:'T5',title:'High innovation · spillovers',coalition:true,innovation:.07,spill:true}
];
function prescribedMembers(t){return t.id==='T0'?[]:t.id==='T4'?[0,1,2,3,4,5,6]:[0,1];}
const memberA=s=>2*s+1;
function coalitionActions(t,members){const s=members.length;if(s<2)return Array(7).fill(50);return Array.from({length:7},(_,i)=>members.includes(i)?memberA(s):(105-s*memberA(s))/(7-s));}
function coalitionPayoffs(t,members,actions){const s=members.length,formed=t.coalition&&s>=2,X=SUM(actions),gross=actions.map((a,i)=>{const b=6*(1+(formed&&(members.includes(i)||t.spill)?s*t.innovation:0));return 10*a+b*(50-a)-X;});return {X,gross,expected:gross.map(v=>v*(X>105+1e-8?.5:1)),crossed:X>105+1e-8};}
function catalystRound(t,join,action,seat=6,baseline='safe',coin=.9){
 if(!CATALYST_CASES.includes(t))throw Error('Invalid treatment');
 let members=prescribedMembers(t).filter(i=>i!==seat);if(t.coalition&&join)members.push(seat);if(!t.coalition)members=[];
 const formed=members.length>=2,actions=t.coalition?coalitionActions(t,members):Array(7).fill(baseline==='safe'?15:50);
 const bound=formed&&members.includes(seat);
 if(!bound){if(!Number.isInteger(action)||action<0||action>50)throw Error('Invalid investment');actions[seat]=action;}
 const r=coalitionPayoffs(t,members,actions),lost=r.crossed&&coin<.5;
 return {...r,members,formed,bound,actions,lost,realized:r.gross.map(v=>lost?0:v),total:lost?0:r.gross[seat],seat};
}
const QUORUM_CASES=[{title:'Known target · 75% loss risk',p:.75,uncertain:false},{title:'Known target · 55% loss risk',p:.55,uncertain:false},{title:'Known target · 95% loss risk',p:.95,uncertain:false},{title:'Two targets · 95% loss risk',p:.95,uncertain:true},{title:'Two targets · 55% loss risk',p:.55,uncertain:true},{title:'Two targets · 75% loss risk',p:.75,uncertain:true}];
function quorumSurvival(c,total){return c.uncertain?(total>=290?1:total>=190?1-.45*c.p:1-.9*c.p):(total>=240?1:1-.9*c.p);}
function quorumExpected(c,xs){const s=quorumSurvival(c,SUM(xs));return xs.map(x=>(120-x)*s);}
const balanced=(total,n)=>Array.from({length:n},(_,i)=>Math.floor(total/n)+(i<total%n?1:0));
function isQuorumNash(c,xs){const pay=quorumExpected(c,xs);return xs.every((_,i)=>Array.from({length:121},(_,d)=>{const a=[...xs];a[i]=d;return quorumExpected(c,a)[i]<=pay[i]+1e-9;}).every(Boolean));}
function quorumProfile(c,mode='provision'){
 if(mode==='zero')return [0,0,0,0];
 const candidates=[0,...(c.uncertain?[190,290]:[240])].map(t=>balanced(t,4)).filter(xs=>isQuorumNash(c,xs));
 return candidates.sort((a,b)=>SUM(quorumExpected(c,b))-SUM(quorumExpected(c,a)))[0];
}
function quorumRound(c,x,mode='provision',seat=0,random=Math.random){
 if(!Number.isInteger(x)||x<0||x>120)throw Error('Invalid contribution');
 const xs=quorumProfile(c,mode);xs[seat]=x;const threshold=c.uncertain?(random()<.5?190:290):240,success=SUM(xs)>=threshold,loss=!success&&random()<c.p;
 return {xs,threshold,success,loss,expected:quorumExpected(c,xs),realized:xs.map(x=>(120-x)*(loss?.1:1)),total:(120-x)*(loss?.1:1)};
}
const FOGLINE_PROFILES={certainty:{provision:[20,20,20,20,20,20],zero:[0,0,0,0,0,0]},risk:{zero:[0,0,0,0,0,0],small:[4,4,4,4,2,2],medium:[8,8,6,6,6,6]},ambiguity:{robust:[0,0,0,0,0,0]}};
function fogCDF(type,total,bag){if(type==='certainty')return total>=120?1:0;if(type==='risk')return Math.min(13,Math.floor(total/20)+1)/13;if(!bag)throw Error('No probability supplied for ambiguity');return SUM(bag.filter(t=>t<=total).map(()=>1))/bag.length;}
function fogExpected(type,own,others,bag){return (40-own)*(.1+.9*fogCDF(type,own+others,bag));}
function fogPlan(total){if(total<0||total>40||total%2)throw Error('Invalid planned contribution');const a=[];for(let i=0;i<10;i++){const x=Math.min(4,total);a.push(x);total-=x;}return a;}
function fogSchedule(type,mode){return FOGLINE_PROFILES[type][mode].map(c=>type==='certainty'&&mode==='provision'?Array(10).fill(2):fogPlan(c));}
function hiddenBag(random=Math.random){const bag=[],counts=Array(13).fill(0);while(bag.length<52){const i=Math.min(12,Math.floor(random()*13));if(counts[i]<50){bag.push(i*20);counts[i]++;}else {const j=counts.findIndex(c=>c<50);bag.push(j*20);counts[j]++;}}return bag;}
function fogFinish(type,contributions,random=Math.random,bag){const totals=contributions.map(SUM),group=SUM(totals),threshold=type==='certainty'?120:type==='risk'?Math.floor(random()*13)*20:bag[Math.min(bag.length-1,Math.floor(random()*bag.length))],success=group>=threshold;return {totals,group,threshold,success,earnings:totals.map(c=>(40-c)*(success?1:.1))};}

function frame(name,tag,title,copy,content){$('#app').innerHTML=`<a class="skip" href="#main">Skip to game</a><header><div class="wrap"><a class="brand" href="games.html">${name}</a><nav><a href="games.html">All games ↗</a><button class="quiet-button" id="rules">Rules & research</button></nav></div></header><main class="wrap" id="main"><div class="intro"><div><p class="eyebrow">${tag}</p><h1>${title}</h1></div><p class="intro-copy">${copy}</p></div>${content}<p class="live" id="live" role="status" aria-live="polite"></p></main><footer><div class="wrap"><span>Classroom adaptation · Fictional points · Bots follow the disclosed benchmark.</span><a href="https://github.com/aletavoni/common-ground">View collection source ↗</a></div></footer>`;$('#rules').onclick=()=>openGuide(name,gameGuide);}
function openGuide(name,html){const d=$('#guide');d.innerHTML=`<div class="guide-head"><h2>${name}: rules & research</h2><button id="close-guide" class="quiet-button">Close</button></div><div class="guide-body">${html}<h3>Teaching adaptation and data</h3><p>This app uses fictional cumulative points, immediate feedback and the stated bots. It does not reproduce the experiment’s participants, matching pool, practice tasks or monetary payment. Human deviations need not produce equilibrium play. There are no accounts or analytics. Choices stay in this page’s memory and reset on refresh; downloads are created locally. Ordinary hosting access logs may exist.</p></div>`;d.showModal();$('#close-guide').onclick=()=>d.close();}
function exportCSV(name,rows){const keys=Object.keys(rows[0]||{}),escape=x=>'"'+String(x??'').replaceAll('"','""')+'"',text=[keys.map(escape).join(','),...rows.map(r=>keys.map(k=>escape(r[k])).join(','))].join('\r\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const stat=(label,value)=>`<div class="stat"><span>${label}</span><strong>${value}</strong></div>`;
const field=(label,id,options,value)=>`<label class="field"><span>${label}</span><select id="${id}">${options.map(([v,l])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${l}</option>`).join('')}</select></label>`;
const number=(label,id,value,min,max,step=1)=>`<label class="field"><span>${label}</span><input type="number" id="${id}" value="${value}" min="${min}" max="${max}" step="${step}" inputmode="numeric"></label>`;
const humanNote='<p class="fine">A Nash equilibrium is a set of strategies where nobody gains in expected earnings by changing only their own strategy. Bots are mathematical benchmarks, not estimates of human behavior.</p>';

{
let net='circle',length=5,x=16,stage='choose',r=null,points=0,roundIndex=0,pun=[0,0,0,0];
const letters=['A','B','C','D'];
gameGuide=`<h3>The common-pool resource</h3><p>Four people each receive 25 tokens. Put x tokens into the common account, interpreted as extraction effort; leave 25−x in the private account. Private tokens return 5 points each. Common returns are 25X−0.25X², where X is everybody’s extraction effort, and each person receives their share x/X. This simplifies to 125+20x−0.25xX, including when X=0.</p><h3>Who can monitor whom?</h3><p>In a complete network everyone sees and can punish everyone else. In the undirected circle you see your two neighbors. In the directed circle A monitors B, B monitors C, C monitors D and D monitors A. You occupy seat A. Only neighbors’ choices are revealed in stage 2.</p><h3>Punishment</h3><p>You may spend integer deduction points on eligible neighbors. Each point costs you 1 and subtracts 3 from the target. Total spending may not exceed your stage-1 earnings, rounded down to a whole point. Final earnings are floored at zero after both outgoing costs and incoming deductions.</p><h3>Nash benchmark</h3><p>Self-interested bots choose extraction 16 and issue no punishment. Against three such bots, your earnings before punishment are 125+8x−0.25x², uniquely maximized at x=16: 189 points. At a socially efficient symmetric profile, everyone extracts 10 and earns 225. Costly punishment is not optimal for a selfish player here; bots do not change in response to your sanctions. This is why network architecture leaves this Nash benchmark unchanged even though human punishment can differ across networks.</p><h3>Research</h3><p>Shreedhar, Tavoni and Marchiori (2020), <cite>Monitoring and punishment networks in an experimental common pool resource dilemma</cite>, Environment and Development Economics 25, 66–94. <a href="https://doi.org/10.1017/S1355770X19000457" target="_blank" rel="noopener">Paper ↗</a>. Rules: Section 2 and equations (1)–(2). All three published networks are included. The default session is shortened to 5 rounds, with the original 15 available. Node identities are held fixed with fresh equivalent bots each round; the human matching pool and incentivized belief questions are omitted.</p>${humanNote}`;
function map(){const pos=[[200,50],[350,145],[200,240],[50,145]],allowed=neighbors(0,net);let lines='';for(let i=0;i<4;i++)for(const j of neighbors(i,net)){if(net!=='directed'&&j<i)continue;const a=pos[i],b=pos[j],dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),sx=a[0]+dx/d*27,sy=a[1]+dy/d*27,ex=b[0]-dx/d*30,ey=b[1]-dy/d*30;lines+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" class="${i===0||net!=='directed'&&j===0?'active-edge':'edge'}" ${net==='directed'?'marker-end="url(#arrow)"':''}/>`;}return `<div class="map"><svg viewBox="0 0 400 290" role="img" aria-label="${NET_NAMES[net]}. You are A; you can monitor ${allowed.map(i=>letters[i]).join(' and ')}."><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="#66896c"/></marker></defs>${lines}${pos.map(([px,py],i)=>`<circle cx="${px}" cy="${py}" r="25" class="station ${i===0?'self':''}"/><text x="${px}" y="${py+4}" class="${i===0?'self-label':''}">${letters[i]}</text><text x="${px}" y="${py+40}" class="sub">${i===0?'YOU':stage==='choose'?'HIDDEN':allowed.includes(i)?'16 TOKENS':'UNOBSERVED'}</text>`).join('')}</svg></div>`;}
function render(){const complete=roundIndex===length;frame('WATERSHED','MONITORING / NETWORKS / THE COMMONS','What can you see?<br>Who can you sanction?','Allocate your extraction effort, inspect your neighbors, then decide whether punishment is worth its cost.',`<div class="layout"><section class="panel"><p class="eyebrow">ROUND ${Math.min(roundIndex+1,length)} / ${length} · ${complete?'SESSION COMPLETE':stage==='choose'?'01 / EXTRACTION':'02 / MONITORING & DEDUCTIONS'}</p><h2>${complete?'Your network, in perspective.':stage==='choose'?'Take from the shared resource.':'Only your neighbors are visible.'}</h2>${map()}${complete?`<div class="note">You earned ${fmt(points)} points over ${length} rounds. The bots always extracted 16 and punished zero. Compare networks to see how monitoring opportunities change, even when this equilibrium prediction does not.</div><button class="primary" id="again">Play again</button><button class="quiet-button" id="export">Download choices (CSV)</button>`:stage==='choose'?`<label class="field"><span>Your common-account tokens · extraction effort</span><output class="counter" id="x-value">${x}</output><input id="extraction" type="range" min="0" max="25" step="1" value="${x}" aria-label="Your extraction effort"></label><div class="token-strip" aria-hidden="true">${Array.from({length:25},(_,i)=>`<span class="${i<x?'taken':''}"></span>`).join('')}</div><div class="stats">${stat('PRIVATE TOKENS',25-x)}${stat('BOT EXTRACTION','16 each')}${stat('NASH EARNINGS','189')}</div><p class="fine">Every private token earns 5 points. More common-account effort raises your share, but reduces the resource’s return to everyone.</p><button class="primary" id="extract">Allocate tokens →</button>`:`<div class="stats">${stat('YOUR STAGE-1 EARNINGS',fmt(r.first[0]))}${stat('PUNISHMENT BUDGET',Math.floor(r.first[0]))}${stat('PERSONAL COST',stage==='finished'?r.spent:'<span id="spent">0</span>')}</div><div class="punishments">${[1,2,3].map(i=>r.allowed.includes(i)?`<div class="punishment"><h3>Neighbor ${letters[i]}</h3><p>Extracted 16; private tokens 9.</p>${stage==='finished'?`<p>Deduction points: ${pun[i]}<br>Final earnings: ${fmt(r.final[i])}</p>`:number('Deduction points','pun-'+i,0,0,Math.floor(r.first[0]))}</div>`:`<div class="punishment locked"><h3>Player ${letters[i]}</h3><p>Outside your monitoring neighborhood. You cannot observe or punish this player.</p></div>`).join('')}</div>${stage==='monitor'?`<p id="budget-status" class="fine">Each point costs you 1 and removes 3 from the target.</p><button class="primary" id="deduct">Confirm deductions →</button>`:`<section class="result"><h3>You keep ${fmt(r.total)} points.</h3><p>Stage-1 earnings ${fmt(r.first[0])} − outgoing deduction costs ${r.spent} − incoming deductions 0. Bot punishments stay at zero.</p><p class="fine">Your sanctions cannot raise your own earnings against these bots. In the study, human responses made punishment behavior richer than the selfish benchmark.</p><button class="primary" id="next">${roundIndex===length?'View session summary':'Next round →'}</button></section>`}`}</section><aside class="panel side"><h2>Field settings</h2>${field('Monitoring network','network',Object.entries(NET_NAMES),net)}${field('Session length','length',[[5,'5 classroom rounds'],[15,'15 paper rounds']],length)}<button class="quiet-button" id="restart">Apply & restart</button><div class="note"><strong>Bot plan</strong><br>Extract 16 of 25 tokens. Assign no deductions. Keep the same strategy after every human choice.</div><p class="fine">The social benchmark is extraction 10 per person, paying 225 each. The Nash benchmark pays 189 each. Your choices may depart from both.</p><div class="scorebox"><span class="fine">YOUR SESSION POINTS</span><br><strong>${fmt(points)}</strong></div></aside></div>`);$('#network').onchange=()=>{};$('#restart').onclick=()=>{net=$('#network').value;length=Number($('#length').value);reset();};if(complete){$('#again').onclick=reset;$('#export').onclick=()=>exportCSV('watershed',dataRows);return;}if(stage==='choose'){$('#extraction').oninput=e=>{x=Number(e.target.value);$('#x-value').textContent=x;$('.stats').innerHTML=stat('PRIVATE TOKENS',25-x)+stat('BOT EXTRACTION','16 each')+stat('NASH EARNINGS','189');$('.token-strip').innerHTML=Array.from({length:25},(_,i)=>`<span class="${i<x?'taken':''}"></span>`).join('');};$('#extract').onclick=()=>{r=networkRound(x,net);pun=[0,0,0,0];stage='monitor';render();$('#live').textContent=`Stage 1 earned ${fmt(r.first[0])} points. Select deductions for eligible neighbors.`;};}if(stage==='monitor'){r.allowed.forEach(i=>$('#pun-'+i).oninput=()=>{pun[i]=Number($('#pun-'+i).value);const cost=SUM(pun),valid=pun.every(p=>Number.isInteger(p)&&p>=0)&&cost<=Math.floor(r.first[0]);$('#spent').textContent=fmt(cost);$('#deduct').disabled=!valid;$('#budget-status').textContent=valid?'Within your budget. Bots do not issue deductions.':'Use whole non-negative points within your shared budget.';});$('#deduct').onclick=()=>{r=networkRound(x,net,pun);points+=r.total;roundIndex++;dataRows.push({round:roundIndex,network:net,extraction:x,deductions:SUM(pun),earnings:r.total});stage='finished';render();$('#live').textContent=`Round earned ${fmt(r.total)} points.`;};}if(stage==='finished')$('#next').onclick=()=>{stage='choose';r=null;render();};}
function reset(){stage='choose';r=null;roundIndex=0;points=0;pun=[0,0,0,0];dataRows.length=0;render();}
render();

}</script></body></html>
