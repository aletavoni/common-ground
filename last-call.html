// Original classroom implementations. Source PDFs are not distributed.
const sum = xs => xs.reduce((a,b)=>a+b,0);
function integer(value,min,max,label='value') { if(!Number.isInteger(value)||value<min||value>max)throw new RangeError(`${label} must be an integer from ${min} to ${max}`);return value; }
const MENU = [4,6,8,10,12];

// Gosnell & Tavoni (2017): demands are percentages of ORIGINAL wealth.
function bargainConfig(treatment='ASYM',role='poor') {
  if(!['SYM','ASYM','PSD','RSD','ASD'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['poor','rich'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment==='SYM';
  return {treatment,role,human:symmetric?0:role==='rich'?0:2,wealth:symmetric?Array(6).fill(100/6):[30,30,10,10,10,10]};
}
function bargainTarget(round) {integer(round,1,8,'round');return 60-10*Math.floor((round-1)/2);}
function bargainGroups(treatment) {return [...(['RSD','ASD'].includes(treatment)?[[0,1]]:[]),...(['PSD','ASD'].includes(treatment)?[[2,3,4,5]]:[])];}
function bargainCaps(config,round,humanVote=100) {
  integer(humanVote,0,100,'side-deal vote');
  const target=bargainTarget(round),caps=Array(6).fill(100),deals=[];
  for(const members of bargainGroups(config.treatment)) {
    const votes=members.map(i=>i===config.human?humanVote:target),cap=sum(votes)/members.length;
    members.forEach(i=>caps[i]=cap);deals.push({members,votes,cap});
  }
  return {caps,deals};
}
function bargainResolve(config,round,caps,humanDemand) {
  const target=bargainTarget(round),h=config.human;
  if(caps.length!==6||caps.some(c=>!Number.isFinite(c)||c<0||c>100))throw new RangeError('Invalid caps');
  if(!Number.isFinite(humanDemand)||humanDemand<0||humanDemand>caps[h]+1e-9||Math.abs(humanDemand*4-Math.round(humanDemand*4))>1e-7)throw new RangeError('Demand must be a legal quarter percentage point');
  const percentages=caps.map((cap,i)=>i===h?humanDemand:Math.min(target,cap));
  const demands=percentages.map((p,i)=>p*config.wealth[i]/100),total=sum(demands),agreement=total<=target+1e-9;
  const finished=agreement||round===8,payoffs=agreement?demands:finished?config.wealth.map(w=>w*.1):null;
  const other=sum(demands.filter((_,i)=>i!==h));
  const bestAgreement=other>target+1e-9?null:Math.max(0,Math.min(caps[h],Math.floor(((target-other)/config.wealth[h]*100+1e-9)*4)/4));
  return {round,target,percentages,demands,total,agreement,finished,payoffs,bestAgreement};
}

// Kim et al. (2025), p. 1415: incoming fines cannot remove more than
// contribution-stage earnings; outgoing punishment costs remain payable.
function civicResolve(contributions,punishments=Array.from({length:4},()=>Array(4).fill(0))) {
  if(contributions.length!==4||punishments.length!==4)throw new RangeError('Four teams are required');
  contributions.forEach(c=>integer(c,0,20,'contribution'));
  punishments.forEach((row,i)=>{if(row.length!==4)throw new RangeError('Four punishment entries required');row.forEach((p,j)=>{integer(p,0,5,'punishment');if(i===j&&p!==0)throw new RangeError('No self punishment');});});
  const total=sum(contributions),gross=contributions.map(c=>20-c+.4*total);
  const sent=punishments.map(sum),received=contributions.map((_,i)=>sum(punishments.map(row=>row[i])));
  const losses=gross.map((g,i)=>Math.min(g,3*received[i]));
  const payoffs=gross.map((g,i)=>Math.max(0,g-3*received[i])-sent[i]);
  return {contributions:[...contributions],punishments:punishments.map(r=>[...r]),total,gross,sent,received,losses,payoffs,destroyed:sum(gross)-sum(payoffs)};
}

// Heyen, Lohse & Tavoni (supplied working paper), Section 2.
function gobConfig(treatment='AL',role='high') {
  if(!['SH','SL','AH','AL'].includes(treatment))throw new RangeError('Unknown treatment');
  if(!['high','low'].includes(role))throw new RangeError('Unknown role');
  const symmetric=treatment[0]==='S',cost=treatment[1]==='H'?11:9;
  const ideals=symmetric?[6,6,6]:[6,3,3],human=symmetric||role==='high'?0:1;
  const equilibrium=cost===11?[0,0,0]:symmetric?[2,2,2]:[6,0,0];
  return {treatment,role,symmetric,cost,ideals,human,equilibrium,efficientTotal:symmetric?6:3};
}
function gobResolve(quantities,ideals,cost,guesses=null) {
  if(quantities.length!==3||ideals.length!==3||![9,11].includes(cost))throw new RangeError('Invalid GoB setup');
  quantities.forEach(q=>integer(q,0,6,'production'));ideals.forEach(a=>{if(![3,6].includes(a))throw new RangeError('Ideal must be 3 or 6');});
  if(guesses){if(guesses.length!==3)throw new RangeError('Three forecasts required');guesses.forEach(g=>integer(g,0,12,'forecast'));}
  const total=sum(quantities),costs=quantities.map(q=>cost*q),mismatch=ideals.map(a=>10*Math.abs(total-a));
  const base=quantities.map((_,i)=>220-costs[i]-mismatch[i]);
  const bonuses=quantities.map((q,i)=>!guesses?0:Math.abs(guesses[i]-(total-q))===0?30:Math.abs(guesses[i]-(total-q))===1?20:0);
  return {quantities:[...quantities],total,costs,mismatch,base,bonuses,payoffs:base.map((p,i)=>p+bonuses[i])};
}
function gobBestResponses(config,human=config.human,others=config.equilibrium) {
  const values=Array.from({length:7},(_,q)=>{const profile=[...others];profile[human]=q;return gobResolve(profile,config.ideals,config.cost).base[human];});
  const maximum=Math.max(...values);return {values,maximum,choices:values.flatMap((v,q)=>v===maximum?[q]:[])};
}

// Schmid, Tavoni & Winkler (October 2026): exact 0.01 contribution grid.
// Integer numerators prevent rounding from fabricating profitable deviations.
function agentNumerator(treatment,b,p,q) {
  if(!['linear','quadratic'].includes(treatment)||!MENU.includes(b))throw new RangeError('Invalid agent parameters');
  integer(p,0,100,'own percentage');integer(q,0,100,'other percentage');const s=p+q;
  return treatment==='linear'?100*b*s-9*p*p:b*(3400*s-9*s*s)-162*p*p;
}
const agentDenominator = treatment => treatment==='linear'?10000:180000;
const agentPayoff = (treatment,b,p,q)=>agentNumerator(treatment,b,p,q)/agentDenominator(treatment);
function agentBestResponses(treatment,b,q) {
  const values=Array.from({length:101},(_,p)=>agentNumerator(treatment,b,p,q)),maximum=Math.max(...values);
  return {choices:values.flatMap((v,p)=>v===maximum?[p]:[]),maximum:maximum/agentDenominator(treatment)};
}
function continuousAgentEquilibrium(treatment,b1,b2) {return treatment==='linear'?[b1/18,b2/18]:[17*b1/(9*(18+b1+b2)),17*b2/(9*(18+b1+b2))];}
const agentCache=new Map();
function agentEquilibria(treatment,b1,b2) {
  const key=`${treatment}/${b1}/${b2}`;if(agentCache.has(key))return agentCache.get(key).map(x=>[...x]);
  const br1=Array.from({length:101},(_,q)=>agentBestResponses(treatment,b1,q).choices),br2=Array.from({length:101},(_,p)=>agentBestResponses(treatment,b2,p).choices),pairs=[];
  for(let p=0;p<=100;p++)for(const q of br2[p])if(br1[q].includes(p))pairs.push([p,q]);
  if(!pairs.length)throw new Error('No pure grid equilibrium');agentCache.set(key,pairs);return pairs.map(x=>[...x]);
}
function selectedAgentEquilibrium(treatment,b1,b2) {
  const exact=continuousAgentEquilibrium(treatment,b1,b2).map(x=>100*x);
  const candidates=agentEquilibria(treatment,b1,b2);
  candidates.sort((a,b)=>{const da=(a[0]-exact[0])**2+(a[1]-exact[1])**2,db=(b[0]-exact[0])**2+(b[1]-exact[1])**2;return Math.abs(da-db)>1e-9?da-db:b1<=b2?a[0]-b[0]:a[1]-b[1];});
  return [...candidates[0]];
}
function delegationOutcome(treatment,b1,b2) {
  const [p,q]=selectedAgentEquilibrium(treatment,b1,b2);
  return {parameters:[b1,b2],contributions:[p,q],agents:[agentPayoff(treatment,b1,p,q),agentPayoff(treatment,b2,q,p)],principals:[agentPayoff(treatment,8,p,q),agentPayoff(treatment,8,q,p)],equilibria:agentEquilibria(treatment,b1,b2)};
}
function principalBestResponses(treatment,other,seat=0) {
  integer(seat,0,1,'principal seat');
  const values=MENU.map(b=>{const [p,q]=seat===0?selectedAgentEquilibrium(treatment,b,other):selectedAgentEquilibrium(treatment,other,b);return seat===0?agentNumerator(treatment,8,p,q):agentNumerator(treatment,8,q,p);}),maximum=Math.max(...values);
  return {values:values.map(v=>v/agentDenominator(treatment)),maximum:maximum/agentDenominator(treatment),choices:MENU.filter((_,i)=>values[i]===maximum)};
}
function principalEquilibria(treatment) {
  return MENU.flatMap(a=>MENU.filter(b=>principalBestResponses(treatment,b,0).choices.includes(a)&&principalBestResponses(treatment,a,1).choices.includes(b)).map(b=>[a,b]));
}

const UI={
 $:s=>document.querySelector(s),
 n:(v,d=2)=>Number(v).toLocaleString('en-GB',{maximumFractionDigits:d}),
 money:v=>'£'+Number(v).toFixed(2),
 on:(id,event,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(event,fn);},
 guide:content=>{const dialog=document.getElementById('guide');dialog.innerHTML=`<div class="guide-head"><strong>FIELD GUIDE</strong><button id="close-guide" aria-label="Close instructions">Close ×</button></div>${content}<p class="privacy">Fictional earnings. Choices remain in browser memory and reset on refresh. CSV exports are created on your device. There are no analytics or game backend; the website host may keep ordinary access logs.</p>`;document.addEventListener('click',event=>{if(event.target.closest('[data-guide]'))dialog.showModal();if(event.target.closest('#close-guide'))dialog.close();});},
 csv:(filename,records)=>{if(!records.length)return;const keys=Object.keys(records[0]),quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const text=[keys.map(quote).join(','),...records.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},
 focus:()=>{const heading=document.querySelector('main h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}},
 options:(values,current)=>values.map(([value,label])=>`<option value="${value}" ${String(value)===String(current)?'selected':''}>${label}</option>`).join(''),
 table:(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
};

{
const app=UI.$('#app');let setup={treatment:'ASYM',role:'poor'},config=null,round=1,caps=Array(6).fill(100),deals=[],phase='setup',history=[],result=null;
const nation=i=>`${config.treatment==='SYM'?'Country':i<2?'High endowment':'Low endowment'} ${i+1}${i===config.human?' · you':''}`;
const guide=`<h2>A shrinking deal, not a growing fund</h2><p>Six countries simultaneously ask to keep a percentage of their <strong>original</strong> wealth/emissions. The original total is £100. In the unequal treatments, two countries have £30 each and four have £10 each. In the symmetric treatment each has exactly one sixth of £100; displayed currency is rounded.</p><ol><li>The permitted global total is £60 in rounds 1–2, £50 in 3–4, £40 in 5–6 and £30 in 7–8.</li><li>If demands fit within that round’s total, negotiations end. Each country receives its demand. There are no earlier round payments to add.</li><li>If all eight attempts fail, everyone receives 10% of their original wealth, regardless of their last demand.</li></ol><h3>Side deals</h3><p>PSD includes the four low-endowment countries; RSD includes the two high-endowment countries; ASD includes both separate groups. Before rounds 1, 3, 5 and 7, participants in each group propose a percentage ceiling. Their arithmetic mean becomes a binding ceiling for every member for the next two negotiations. It is a cap on each person’s percentage, not a common cash allowance. SYM and ASYM have no side-deal stage.</p><h3>The selected bot equilibrium</h3><p>Every bot asks for the current target percentage of its own original wealth: initially 60%. In a side deal it proposes that same percentage. A bot’s demand is reduced if a binding cap requires it. Bots make no further strategic response to you.</p><p>If everyone follows, demands add to exactly £60 in round 1. Asking for less lowers your payoff. Asking for more breaks agreement and cannot give you more later: targets only tighten. Raising your side-deal ceiling does not lower the others’ fixed demands; lowering it caps your own demand too. This is one selected pure-strategy Nash profile of the full negotiation, derived for this app. Other equilibria exist. We do <strong>not</strong> claim these fixed schedules are subgame-perfect after every off-path history. The displayed residual-demand calculation concerns the current round only.</p><h3>Source and teaching choices</h3><p>Gosnell & Tavoni (2017), <em>A bargaining experiment on heterogeneity and side deals in climate negotiations</em>, Climatic Change 142, 575–586, Methods pp. 578–579. <a href="https://doi.org/10.1007/s10584-017-1975-3" target="_blank" rel="noopener noreferrer">Research paper ↗</a>.</p><p>The app retains the eight attempts, five treatments, wealth weights, binding mean caps, shrinking targets and final fallback. It adds disclosed bot plans, your choice of role, quarter-percentage-point demand steps, whole-percentage ceiling ballots and immediate teaching feedback. It does not reproduce participant behaviour or redistribute the PDF.</p>`;
UI.guide(guide);
function start(){config=bargainConfig(setup.treatment,setup.role);round=1;caps=Array(6).fill(100);history=[];prepare();}
function prepare(){if(round%2===1&&bargainGroups(config.treatment).length){phase='side';}else phase='decision';render();}
function render(){const target=config?bargainTarget(round):60,h=config?.human;
 let main='',aside='';
 if(!config){main=`<p class="eyebrow">THE NEGOTIATION ROOM / GOSNELL & TAVONI</p><h1>The longer you wait,<br>the <em>smaller the deal.</em></h1><p class="dek">Six countries. One shrinking emissions budget. How much will you insist on keeping?</p><div class="issue"><span>Maximum 8 negotiations</span><span>You + 5 equilibrium bots</span></div><p class="small">Demand a share of your own original wealth. A deal is struck only if everyone’s demands fit. Too much delay leaves every country with just 10%.</p><div class="briefing"><h2>Choose your place at the table.</h2><label><span>Negotiation rules</span><select id="treatment">${UI.options([['SYM','Equal endowments · no side deals'],['ASYM','Unequal endowments · no side deals'],['PSD','Low-endowment side deal'],['RSD','High-endowment side deal'],['ASD','Both side deals']],setup.treatment)}</select></label><label><span>Your country</span><select id="role" ${setup.treatment==='SYM'?'disabled':''}>${UI.options([['poor','Low endowment · £10'],['rich','High endowment · £30']],setup.role)}</select></label><p class="small">${setup.treatment==='SYM'?'Everyone has exactly £100 ÷ 6.':'Two countries have £30. Four have £10.'} Bots ask for 60% in the first negotiation and propose 60% ceilings where side deals apply.</p><button class="primary" id="start">Take your seat →</button></div>`;aside=`<p class="dateline">The first deadline</p><div class="clock">60<small>%</small></div><p class="small">of the original £100 can be retained if you agree in rounds 1 or 2.</p><div class="note-box"><h3>After that</h3><p>Rounds 3–4: £50<br>Rounds 5–6: £40<br>Rounds 7–8: £30<br>Eight failures: £10 in total.</p></div><div class="no-payout">These are fictional earnings. You are exploring incentives, not predicting real countries.</div>`;
 }else{const timeline=Array.from({length:8},(_,i)=>`<span class="${i+1===round?'now':i+1<round?'past':''}">${i+1}</span>`).join('');aside=`<p class="dateline">Current global ceiling</p><div class="clock">£${target}</div><p class="small">Total demands must fit inside this amount. It is not a payment every round.</p><div class="timeline" aria-label="Eight negotiation attempts">${timeline}</div><div class="note-box"><h3>Your original endowment</h3><p><strong>${UI.money(config.wealth[h])}</strong><br>Your fallback after eight failures: ${UI.money(config.wealth[h]*.1)}.</p></div><div class="note-box"><h3>The bot plan</h3><p>Ask for ${target}% of original wealth. Propose ${target}% in any side deal. Obey binding caps. No learning or bargaining response to your history.</p></div><button class="text-button" id="reset">Change the setup</button>`;
 main=`<p class="eyebrow">ATTEMPT ${round} / 8 · ${config.treatment} · ${nation(h).toUpperCase()}</p>`;
 if(phase==='side'){const eligible=bargainGroups(config.treatment).some(g=>g.includes(h));main+=`<h1>Set a ceiling.<br><em>Bind your own group.</em></h1><p class="dek">Side-deal ceilings apply to this attempt and the next. Each participating group uses the mean of its members’ proposals.</p><div class="decision-paper side-vote"><h2>${eligible?'Your ceiling ballot':'The other countries have side deals'}</h2><p class="small">${eligible?`Other members of your side deal propose ${target}%. Your ballot changes your whole group’s binding cap.`:`Your country does not join a side deal in ${config.treatment}. Bot participants all propose ${target}%.`}</p>${eligible?`<label><span>Maximum percentage each member may demand</span><div class="percent-box"><input type="number" id="vote" min="0" max="100" step="1" value="${target}"><strong>%</strong></div></label>`:''}<button class="primary" id="vote-submit">${eligible?'Submit my ballot':'Reveal the side deals'} →</button></div>`;}
 if(phase==='caps'){main+=`<h1>A ceiling,<br><em>not an agreement.</em></h1><p class="dek">These limits now bind the participants for rounds ${round}–${round+1}. The global negotiation still has to fit inside £${target}.</p><div class="decision-paper">${deals.map(d=>`<h2>${d.members[0]<2?'High':'Low'}-endowment side deal</h2><p class="small">Ballots: ${d.votes.join('%, ')}%. Mean cap: <strong>${UI.n(d.cap)}%</strong> of each member’s original wealth.</p>`).join('')}<button class="primary" id="negotiate">Begin the global negotiation →</button></div>`;}
 if(phase==='decision'){const cap=caps[h],defaultDemand=Math.min(target,cap);main+=`<h1>How much<br>will you <em>keep?</em></h1><p class="dek">Your demand is a percentage of your original ${UI.money(config.wealth[h])}. Everyone submits before seeing the others’ choices.</p><div class="decision-paper"><h2>Your demand</h2><label><span>Percentage of your original endowment</span><div class="percent-box"><input id="demand" type="number" min="0" max="${cap}" step="0.25" value="${defaultDemand}"><strong>%</strong></div></label><input type="range" id="demand-range" aria-label="Demand percentage slider" min="0" max="${cap}" step="0.25" value="${defaultDemand}"><p class="small" id="demand-preview">Requesting ${UI.money(defaultDemand*config.wealth[h]/100)}. Binding cap: ${UI.n(cap)}%.</p><button class="primary" id="submit">Submit my demand →</button><p class="small muted">A lower demand is a concession. A demand above the remaining global space causes another failed attempt.</p></div>`;}
 if(phase==='result'){main+=`<h1>${result.agreement?'We have a deal.':result.finished?'Time has run out.':'No agreement.'}<br><em>${result.agreement?'The negotiation ends.':result.finished?'The fallback applies.':'The clock keeps moving.'}</em></h1><div class="result-banner">Total demands: <strong>${UI.money(result.total)}</strong> against a £${target} ceiling.${result.finished?`<br>Your final payoff: <strong>${UI.money(result.payoffs[h])}</strong>.`:'<br>No payments are made yet.'}</div>`;
 main+=`<div class="decision-paper"><h2>Every country’s demand</h2>${result.demands.map((d,i)=>`<div class="nation-row ${i===h?'you':''}"><span>${nation(i)}</span><div class="track"><div style="width:${result.percentages[i]}%"></div></div><span>${UI.money(d)}</span></div>`).join('')}<p class="small">Each bar shows the share of that country’s own original endowment.</p></div><div class="result-note">${result.agreement?`Against these fixed bot demands, the largest demand that still secured this round’s agreement was ${UI.n(result.bestAgreement)}%. ${result.percentages[h]<result.bestAgreement?'You could have kept more without breaking agreement.':'Your demand was a current-round best response.'}`:result.finished?'After eight failures every player keeps 10% of their original wealth. Demands from earlier rounds are not earnings.':`The bots together requested ${UI.money(sum(result.demands.filter((_,i)=>i!==h)))}. A demand of at most ${UI.n(result.bestAgreement)}% would have secured agreement this round. Later rounds cannot offer a larger proportional equilibrium share.`}</div><div class="button-row">${!result.finished?'<button class="primary" id="next">Continue negotiations →</button>':'<button class="primary" id="again">Negotiate again →</button>'}<button class="secondary" id="csv">Download the ledger</button></div>`;
 if(result.finished)main+=UI.table(['Country','Original','Final payoff'],config.wealth.map((w,i)=>[nation(i),UI.money(w),UI.money(result.payoffs[i])]));
 }
 }
 app.innerHTML=`<header class="masthead"><a class="wordmark" href="games.html">LAST CALL.</a><span class="edition">THE CLASSROOM NEGOTIATION ROOM</span><nav><a href="games.html">All games</a><button class="text-button guide-link" data-guide>Instructions</button></nav></header><main id="main" class="news-layout"><article class="story">${main}<footer>Based on Gosnell & Tavoni (2017). Selected equilibrium schedules; fictional wealth. <button class="text-button" data-guide>Instructions</button></footer></article><aside class="sidebar">${aside}</aside></main>`;
 UI.on('treatment','change',e=>{setup.treatment=e.target.value;render();});UI.on('role','change',e=>setup.role=e.target.value);UI.on('start','click',()=>{start();UI.focus();});
 UI.on('vote-submit','click',()=>{const input=UI.$('#vote');if(input&&!input.reportValidity())return;const outcome=bargainCaps(config,round,input?Number(input.value):target);caps=outcome.caps;deals=outcome.deals;phase='caps';render();UI.focus();});
 UI.on('negotiate','click',()=>{phase='decision';render();UI.focus();});
 const sync=(from,to)=>{const v=Number(UI.$(from).value);UI.$(to).value=v;UI.$('#demand-preview').textContent=`Requesting ${UI.money(v*config.wealth[h]/100)}. Binding cap: ${UI.n(caps[h])}%.`;};
 UI.on('demand','input',()=>sync('#demand','#demand-range'));UI.on('demand-range','input',()=>sync('#demand-range','#demand'));
 UI.on('submit','click',()=>{if(!UI.$('#demand').reportValidity())return;result=bargainResolve(config,round,caps,Number(UI.$('#demand').value));history.push({...result,caps:[...caps]});phase='result';render();UI.focus();});
 UI.on('next','click',()=>{round++;prepare();UI.focus();});UI.on('again','click',()=>{start();UI.focus();});UI.on('reset','click',()=>{config=null;phase='setup';render();UI.focus();});
 UI.on('csv','click',()=>UI.csv('last-call-ledger.csv',history.flatMap(r=>r.demands.map((d,i)=>({treatment:config.treatment,round:r.round,player:i+1,human:i===h,original_wealth:config.wealth[i],cap_percent:r.caps[i],demand_percent:r.percentages[i],demand:d,target:r.target,global_demand:r.total,agreement:r.agreement,final_payoff:r.payoffs?.[i]??''})))));
}
render();

}
</script></body></html>
